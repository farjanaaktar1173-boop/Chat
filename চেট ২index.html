<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Chat</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',system-ui,'Noto Sans Bengali',Tahoma,sans-serif;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:#0a0616;display:flex;justify-content:center;align-items:center;height:100dvh;overflow:hidden;color:#fff;position:relative}

/* Background orbs */
.bg-orbs{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.bg-orbs span{position:absolute;border-radius:50%;filter:blur(90px);opacity:.5}
.bg-orbs span:nth-child(1){width:340px;height:340px;background:#ec4899;top:-90px;left:-90px;animation:float1 16s ease-in-out infinite}
.bg-orbs span:nth-child(2){width:300px;height:300px;background:#a855f7;bottom:-100px;right:-80px;animation:float2 19s ease-in-out infinite}
.bg-orbs span:nth-child(3){width:260px;height:260px;background:#f472b6;top:45%;left:58%;animation:float3 22s ease-in-out infinite;opacity:.4}
@keyframes float1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(80px,60px) scale(1.25)}}
@keyframes float2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-70px,-70px) scale(1.18)}}
@keyframes float3{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-90px,50px) scale(1.3)}}

/* HEARTS BG */
.hearts-bg{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden}
.hearts-bg span{position:absolute;font-size:16px;opacity:.25;animation:floatHeart linear infinite}
@keyframes floatHeart{0%{transform:translateY(100vh) rotate(0);opacity:0}10%{opacity:.3}90%{opacity:.3}100%{transform:translateY(-10vh) rotate(360deg);opacity:0}}

/* SCREEN */
.screen{width:100%;max-width:480px;height:100dvh;display:flex;flex-direction:column;background:rgba(20,10,32,.92);backdrop-filter:blur(22px);overflow:hidden;position:relative;z-index:2;padding-bottom:72px}
@media(min-width:520px){.screen{height:92dvh;border-radius:28px;border:1px solid rgba(244,114,182,.25)}}

/* HEADER */
.header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:linear-gradient(135deg,rgba(236,72,153,.4),rgba(168,85,247,.25));border-bottom:1px solid rgba(244,114,182,.2);flex-shrink:0;gap:10px}
.my-profile{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.my-av{width:44px;height:44px;border-radius:50%;overflow:hidden;border:2px solid rgba(244,114,182,.6);flex-shrink:0;background:#2a1a3e;display:grid;place-items:center;font-size:18px;color:#fbcfe8}
.my-av img{width:100%;height:100%;object-fit:cover}
.my-info{min-width:0}
.mname{font-size:14px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:160px}
.muid{font-size:10px;color:rgba(251,207,232,.75);font-family:monospace;margin-top:2px}
.hdr-actions{display:flex;gap:8px;flex-shrink:0}
.icon-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:rgba(236,72,153,.2);border:1px solid rgba(244,114,182,.4);color:#fbcfe8;font-size:15px;cursor:pointer}
.icon-btn:active{transform:scale(.92)}

.status-bar{padding:8px 16px;font-size:11.5px;color:rgba(251,207,232,.7);background:rgba(0,0,0,.3);text-align:center;border-bottom:1px solid rgba(244,114,182,.1)}
.status-bar.ok{color:#86efac;background:rgba(34,197,94,.1)}
.status-bar.err{color:#fca5a5;background:rgba(239,68,68,.1)}

/* TABS */
.tabs{display:flex;padding:10px 14px 0;gap:8px;flex-shrink:0;border-bottom:1px solid rgba(244,114,182,.15)}
.tab{flex:1;padding:12px 6px;text-align:center;font-size:14px;font-weight:600;color:rgba(251,207,232,.6);cursor:pointer;border-bottom:2px solid transparent;position:relative}
.tab.active{color:#fff;border-bottom-color:#ec4899}
.tab-badge{position:absolute;top:8px;right:calc(50% - 34px);background:#ef4444;color:#fff;font-size:10px;font-weight:700;min-width:18px;height:18px;border-radius:9px;padding:0 5px;display:none;place-items:center}
.tab-badge.show{display:grid}

/* LIST */
.list-area{flex:1;overflow-y:auto;padding:8px 0 20px}
.user-item{display:flex;align-items:center;gap:12px;padding:12px 16px;cursor:pointer;border-bottom:1px solid rgba(244,114,182,.06);position:relative}
.user-item:active{background:rgba(236,72,153,.1)}
.u-avatar{width:52px;height:52px;border-radius:50%;flex-shrink:0;background:#2a1a3e;overflow:hidden;display:grid;place-items:center;font-size:20px;color:#fbcfe8;position:relative}
.u-avatar img{width:100%;height:100%;object-fit:cover}
.u-avatar .status-dot{position:absolute;bottom:2px;right:2px;width:13px;height:13px;border-radius:50%;background:#6b7280;border:2.5px solid #1a0b22}
.u-avatar .status-dot.online{background:#22c55e;box-shadow:0 0 10px rgba(34,197,94,.9)}
.u-info{flex:1;min-width:0}
.u-name{font-size:15px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.u-last{font-size:12.5px;color:rgba(255,255,255,.5);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
.u-last .lbl-sender{color:#f9a8d4;font-weight:600}
.u-meta{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex-shrink:0}
.u-time{font-size:11px;color:rgba(251,207,232,.6)}
.u-unread{background:#22c55e;color:#fff;font-size:11px;font-weight:700;min-width:22px;height:22px;border-radius:11px;padding:0 7px;display:grid;place-items:center;box-shadow:0 0 12px rgba(34,197,94,.7);animation:pop .3s}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}

.empty{text-align:center;padding:60px 20px;color:rgba(255,255,255,.5);font-size:14px;line-height:1.7}
.empty .big{font-size:64px;margin-bottom:16px;opacity:.5}

.req-card{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid rgba(244,114,182,.06)}
.req-card .av{width:52px;height:52px;border-radius:50%;overflow:hidden;background:#2a1a3e;flex-shrink:0}
.req-card .av img{width:100%;height:100%;object-fit:cover}
.req-info{flex:1;min-width:0}
.req-info .rn{font-size:14px;font-weight:600;color:#fff}
.req-info .rt{font-size:11.5px;color:rgba(251,207,232,.7);margin-top:3px}
.req-actions{display:flex;gap:6px;flex-shrink:0}
.req-actions button{padding:8px 14px;border:none;border-radius:10px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit}
.req-actions .acc{background:#22c55e;color:#fff}
.req-actions .blk{background:rgba(255,255,255,.1);color:#ff8a9c}

/* CHAT SCREEN */
.chat-screen{width:100%;max-width:480px;height:100dvh;display:none;flex-direction:column;background:#0a0616;position:fixed;inset:0;margin:auto;z-index:100;padding-bottom:72px}
@media(min-width:520px){.chat-screen{height:92dvh;border-radius:28px;border:1px solid rgba(244,114,182,.25)}}
.chat-screen.show{display:flex}
.chat-header{display:flex;align-items:center;padding:12px 14px;background:linear-gradient(135deg,rgba(236,72,153,.4),rgba(168,85,247,.25));border-bottom:1px solid rgba(244,114,182,.2);gap:10px;flex-shrink:0}
.back-btn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#fbcfe8;font-size:16px;cursor:pointer;flex-shrink:0;background:rgba(236,72,153,.2)}
.back-btn:active{transform:scale(.92)}
.chat-header .av{width:42px;height:42px;border-radius:50%;overflow:hidden;background:#2a1a3e;flex-shrink:0;position:relative}
.chat-header .av img{width:100%;height:100%;object-fit:cover}
.chat-header .av .st-dot{position:absolute;bottom:0;right:0;width:11px;height:11px;border-radius:50%;background:#6b7280;border:2px solid #1a0b22}
.chat-header .av .st-dot.online{background:#22c55e}
.chat-info{flex:1;min-width:0}
.chat-info .cn{font-size:14.5px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-info .cs{font-size:11px;color:rgba(251,207,232,.7);margin-top:1px}
.call-btn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#7dffa1;background:rgba(43,138,64,.25);border:1px solid rgba(43,138,64,.5);cursor:pointer;flex-shrink:0;font-size:15px}
.call-btn:active{transform:scale(.92)}

/* CHAT BODY */
.chat-body{flex:1;padding:16px 14px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;background:radial-gradient(circle at 15% 10%,rgba(236,72,153,.12),transparent 45%),radial-gradient(circle at 85% 85%,rgba(168,85,247,.1),transparent 45%)}
.msg-wrap{display:flex;max-width:80%;flex-direction:column;animation:slide .3s both;cursor:pointer;position:relative}
@keyframes slide{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.msg-wrap.out{align-self:flex-end;align-items:flex-end}
.msg-wrap.in{align-self:flex-start;align-items:flex-start}
.bubble{padding:10px 14px;border-radius:18px;font-size:14.5px;line-height:1.5;word-wrap:break-word;max-width:100%;position:relative}
.bubble.in{background:rgba(255,255,255,.1);border:1px solid rgba(244,114,182,.2);color:#eaeaff;border-bottom-left-radius:6px}
.bubble.out{background:linear-gradient(135deg,#ec4899,#d946ef 55%,#a855f7);color:#fff;border-bottom-right-radius:6px;box-shadow:0 10px 26px rgba(236,72,153,.4)}
.bubble img:not(.emoji-big),.bubble video{max-width:100%;border-radius:10px;margin-top:4px;display:block}
.mt{font-size:10px;margin-top:4px;opacity:.75;text-align:right;display:flex;align-items:center;justify-content:flex-end;gap:4px}
.bubble.in .mt{text-align:left;justify-content:flex-start}
.tick{font-size:11px}

/* BIG EMOJI (iMessage style) */
.bubble.emoji-only{background:transparent!important;border:none!important;padding:4px!important;box-shadow:none!important}
.emoji-big{width:72px;height:72px;object-fit:contain;display:block;filter:drop-shadow(0 4px 12px rgba(236,72,153,.4));animation:emojiPop .5s cubic-bezier(.2,.8,.2,1.5) both}
@keyframes emojiPop{0%{transform:scale(.3) rotate(-15deg);opacity:0}70%{transform:scale(1.15) rotate(8deg);opacity:1}100%{transform:scale(1) rotate(0);opacity:1}}

/* Voice player */
.voice-player{display:flex;align-items:center;gap:10px;padding:4px 2px;min-width:190px}
.vp-play{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.25);border:none;color:#fff;cursor:pointer;display:grid;place-items:center;font-size:14px;flex-shrink:0}
.vp-bar{flex:1;height:6px;border-radius:3px;background:rgba(255,255,255,.25);overflow:hidden;position:relative;cursor:pointer;min-width:60px}
.vp-bar-inner{height:100%;width:0%;background:linear-gradient(90deg,#fbcfe8,#fff);border-radius:3px}
.vp-time{font-size:11px;opacity:.9;font-variant-numeric:tabular-nums;min-width:38px;text-align:right;font-weight:700}

/* Reply bar */
.reply-bar{display:none;align-items:center;gap:10px;padding:10px 14px;background:rgba(236,72,153,.15);border-top:1px solid rgba(244,114,182,.3);flex-shrink:0}
.reply-bar.show{display:flex}
.rb-left{width:4px;height:38px;border-radius:3px;background:linear-gradient(180deg,#ec4899,#a855f7);flex-shrink:0}
.rb-content{flex:1;min-width:0}
.rb-name{font-size:11.5px;font-weight:700;color:#f9a8d4}
.rb-text{font-size:12.5px;color:rgba(255,255,255,.75);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.rb-close{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.1);border:none;color:#fbcfe8;cursor:pointer;display:grid;place-items:center;font-size:14px;flex-shrink:0}

/* Quote box */
.quote-box{margin-bottom:6px;padding:7px 10px;border-radius:10px;background:rgba(0,0,0,.22);border-left:3px solid #f472b6}
.bubble.out .quote-box{background:rgba(255,255,255,.15);border-left-color:#fff}
.quote-name{font-size:10.5px;font-weight:700;color:#f9a8d4;margin-bottom:2px}
.bubble.out .quote-box .quote-name{color:#fce7f3}
.quote-text{font-size:12px;color:rgba(255,255,255,.85);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px}

/* Recording bar */
.rec-bar{display:none;align-items:center;justify-content:center;gap:10px;padding:10px;background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.4);border-radius:18px;margin:6px 12px 0;font-size:13px;color:#fca5a5;font-weight:600;flex-shrink:0}
.rec-bar.show{display:flex}
.rec-bar .dot{width:10px;height:10px;border-radius:50%;background:#ef4444;animation:recPulse 1s infinite}
@keyframes recPulse{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,.7)}50%{box-shadow:0 0 0 10px rgba(239,68,68,0)}}
.rec-btn{padding:6px 12px;border-radius:9px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;border:none}
.rec-btn.send{background:#ef4444;color:#fff}
.rec-btn.cancel{background:rgba(255,255,255,.15);color:#fff}

/* Chat footer */
.chat-footer{display:flex;align-items:center;padding:10px 10px;gap:6px;background:rgba(20,10,32,.98);border-top:1px solid rgba(244,114,182,.2);flex-shrink:0;position:relative}
.act-btn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:rgba(236,72,153,.15);border:1px solid rgba(244,114,182,.3);color:#fbcfe8;font-size:15px;cursor:pointer;flex-shrink:0}
.act-btn.recording{background:#ef4444;color:#fff;animation:recPulse 1s infinite}
.input-box{flex:1;display:flex;align-items:center;background:rgba(236,72,153,.1);border:1px solid rgba(244,114,182,.3);border-radius:22px;padding:0 12px;min-width:0}
.input-box input{flex:1;background:transparent;border:none;outline:none;padding:11px 0;color:#fff;font-size:14px;font-family:inherit;min-width:0}
.input-box input::placeholder{color:rgba(251,207,232,.5)}
.send-btn{width:42px;height:42px;border-radius:50%;border:none;background:linear-gradient(135deg,#ec4899,#a855f7);color:#fff;font-size:15px;cursor:pointer;flex-shrink:0}

/* ============ EMOJI PICKER (HALF SCREEN BOTTOM SHEET) ============ */
.emoji-sheet-backdrop{position:fixed;inset:0;z-index:400;background:rgba(0,0,0,.55);backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:.3s}
.emoji-sheet-backdrop.show{opacity:1;pointer-events:auto}
.emoji-sheet{position:fixed;left:50%;bottom:0;transform:translate(-50%,100%);width:100%;max-width:480px;height:50vh;min-height:280px;z-index:401;background:rgba(30,15,45,.99);border-top-left-radius:26px;border-top-right-radius:26px;border:1px solid rgba(244,114,182,.35);border-bottom:none;transition:transform .35s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;overflow:hidden;padding-bottom:env(safe-area-inset-bottom)}
.emoji-sheet.show{transform:translate(-50%,0)}
.emoji-sheet-handle{width:44px;height:4px;border-radius:3px;background:rgba(244,114,182,.5);margin:10px auto 8px;flex-shrink:0}
.emoji-sheet-title{padding:0 18px 10px;font-size:14px;font-weight:700;color:#fbcfe8;text-align:center;border-bottom:1px solid rgba(244,114,182,.15);flex-shrink:0}
.emoji-sheet-body{flex:1;overflow-y:auto;padding:12px;display:grid;grid-template-columns:repeat(4,1fr);gap:10px;align-content:start}
.emoji-sheet-body::-webkit-scrollbar{width:5px}
.emoji-sheet-body::-webkit-scrollbar-thumb{background:rgba(244,114,182,.4);border-radius:10px}
.emoji-tile{aspect-ratio:1/1;border-radius:18px;background:rgba(236,72,153,.1);border:1px solid rgba(244,114,182,.2);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;padding:6px;transition:.22s;overflow:hidden}
.emoji-tile:active{transform:scale(.92);background:rgba(236,72,153,.3)}
.emoji-tile img{width:56px;height:56px;object-fit:contain;pointer-events:none;margin-bottom:4px}
.emoji-tile .lbl{font-size:9.5px;color:rgba(251,207,232,.8);font-weight:600;text-align:center;line-height:1.1;pointer-events:none}

/* ============ SEARCH OVERLAY ============ */
.search-overlay{position:fixed;inset:0;z-index:500;background:#0a0616;display:none;flex-direction:column}
.search-overlay.show{display:flex}
.search-head{display:flex;align-items:center;gap:10px;padding:14px;border-bottom:1px solid rgba(244,114,182,.2)}
.search-head .back{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:rgba(236,72,153,.2);color:#fbcfe8;cursor:pointer;flex-shrink:0}
.search-head input{flex:1;padding:11px 16px;border-radius:22px;border:1px solid rgba(244,114,182,.3);background:rgba(236,72,153,.1);color:#fff;font-size:14px;outline:none;font-family:inherit}
.search-body{flex:1;overflow-y:auto;padding:12px}
.res-card{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;background:rgba(236,72,153,.08);margin-bottom:8px;border:1px solid rgba(244,114,182,.15)}
.res-card img{width:52px;height:52px;border-radius:50%;object-fit:cover;border:2px solid rgba(244,114,182,.4);flex-shrink:0}
.res-info{flex:1;min-width:0}
.res-name{font-size:14.5px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.res-id{font-size:11.5px;color:rgba(251,207,232,.6);font-family:monospace;margin-top:3px}
.res-btn{padding:9px 14px;border-radius:10px;border:none;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;flex-shrink:0}
.res-btn.add{background:linear-gradient(135deg,#ec4899,#a855f7);color:#fff}
.res-btn.sent{background:rgba(34,197,94,.15);color:#86efac;border:1px solid rgba(34,197,94,.4)}
.res-btn.friend{background:rgba(34,197,94,.2);color:#22c55e;border:1px solid rgba(34,197,94,.5)}
.res-btn.self{background:rgba(255,255,255,.1);color:rgba(255,255,255,.5)}
.res-btn.incoming{background:#22c55e;color:#fff}

/* ============ BOTTOM NAV ============ */
.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;display:flex;justify-content:space-around;padding:10px 14px calc(12px + env(safe-area-inset-bottom));background:rgba(10,6,22,.98);backdrop-filter:blur(20px);z-index:600;border-top:1px solid rgba(244,114,182,.2)}
@media(min-width:520px){.bottom-nav{border-radius:0 0 28px 28px;bottom:4dvh}}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:4px;color:rgba(251,207,232,.55);font-size:10px;font-weight:600;text-transform:uppercase;cursor:pointer;background:none;border:none;font-family:inherit;padding:2px 12px;position:relative}
.nav-item .nav-icon{width:44px;height:36px;border-radius:12px;display:grid;place-items:center;font-size:18px;position:relative}
.nav-item.active{color:#ec4899}
.nav-item.active .nav-icon{background:rgba(236,72,153,.18);border:1px solid rgba(236,72,153,.4)}
.nav-badge{position:absolute;top:-4px;right:-2px;background:#ef4444;color:#fff;font-size:10px;font-weight:800;min-width:20px;height:20px;border-radius:10px;padding:0 5px;display:none;place-items:center;border:2px solid #0a0616;box-shadow:0 0 10px rgba(239,68,68,.8)}
.nav-badge.show{display:grid}

/* TOAST */
.toast{position:fixed;bottom:110px;left:50%;transform:translateX(-50%) translateY(30px);padding:11px 22px;border-radius:16px;background:#ec4899;color:#fff;font-size:13.5px;font-weight:600;z-index:5000;opacity:0;transition:.3s;pointer-events:none;max-width:90%;text-align:center;box-shadow:0 14px 32px rgba(236,72,153,.6)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* CALL OVERLAY */
.call-overlay{position:fixed;inset:0;z-index:3000;display:none;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 0%,#3a1454 0%,#0a0616 70%)}
.call-overlay.show{display:flex}
.incoming-card,.call-card{width:min(90vw,340px);padding:34px 24px 28px;border-radius:32px;background:linear-gradient(160deg,rgba(236,72,153,.2),rgba(168,85,247,.1));border:1px solid rgba(244,114,182,.35);backdrop-filter:blur(30px);text-align:center}
.call-avatar{width:110px;height:110px;margin:0 auto 18px;border-radius:50%;position:relative}
.call-avatar img{width:100%;height:100%;border-radius:50%;object-fit:cover;border:3px solid rgba(244,114,182,.5)}
.call-avatar::before{content:'';position:absolute;inset:-10px;border-radius:50%;border:2px solid rgba(236,72,153,.7);animation:ringPulse 1.5s ease-out infinite}
@keyframes ringPulse{0%{transform:scale(.9);opacity:1}100%{transform:scale(1.3);opacity:0}}
.call-card h3,.incoming-card h3{font-size:22px;font-weight:700;color:#fff;margin-bottom:6px}
.call-card p,.incoming-card p{font-size:14px;color:rgba(255,255,255,.7);margin-bottom:26px}
.call-actions{display:flex;justify-content:center;gap:22px}

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
import {
  getFirestore, doc, getDoc, setDoc, updateDoc, deleteDoc,
  onSnapshot, collection, query, orderBy, limit, addDoc, where, getDocs
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";
import {
  getDatabase, ref as rtRef, onValue as rtOnValue,
  set as rtSet, update as rtUpdate, remove as rtRemove,
  push as rtPush, onDisconnect as rtOnDisconnect,
  get as rtGet, serverTimestamp as rtServerTs,
  query as rtQuery, limitToLast as rtLimitToLast
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";

/* ============ FIREBASE ============ */
const firebaseConfig = {
  apiKey: "AIzaSyCTn3QEYtRMxm7Y91RSFSvbRJSRHcXMEdI",
  authDomain: "room-7fbf7.firebaseapp.com",
  databaseURL: "https://room-7fbf7-default-rtdb.firebaseio.com",
  projectId: "room-7fbf7",
  storageBucket: "room-7fbf7.firebasestorage.app",
  messagingSenderId: "417946695868",
  appId: "1:417946695868:web:564bb9c8a06f7c90b2b8b9"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const rtdb = getDatabase(app);

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DEF_AV = 'data:image/svg+xml;utf8,' + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="50" fill="#3b2a4f"/><circle cx="50" cy="40" r="18" fill="#7a6a8f"/><ellipse cx="50" cy="88" rx="30" ry="22" fill="#7a6a8f"/></svg>`);

/* ============ EMOJI LIST (Noto) ============ */
const EMOJI_LIST = [
  { name:'হাসি',     code:'1f602' },
  { name:'ভালোবাসা', code:'1f60d' },
  { name:'কান্না',    code:'1f62d' },
  { name:'রাগ',      code:'1f621' },
  { name:'অবাক',     code:'1f92f' },
  { name:'পার্টি',    code:'1f973' },
  { name:'কুল',      code:'1f60e' },
  { name:'চোখ টেপা', code:'1f609' },
  { name:'চুমু',     code:'1f618' },
  { name:'হৃদয়',     code:'2764_fe0f' },
  { name:'ভাঙা হৃদয়',code:'1f494' },
  { name:'ফুল',      code:'1f337' },
  { name:'আগুন',     code:'1f525' },
  { name:'তালি',     code:'1f44f' },
  { name:'থাম্বস',   code:'1f44d' },
  { name:'তারা',     code:'2b50' }
];
const emojiUrl = code => `https://fonts.gstatic.com/s/e/notoemoji/latest/${code}/512.gif`;
const emojiUrlSmall = code => `https://fonts.gstatic.com/s/e/notoemoji/latest/${code}/512.gif`;

/* ============ STATE ============ */
let me = null;
let friends = {};
let requests = {};
let sent = {};
let metas = {};
let profiles = {};
let presence = {};
let currentChatUid = null;
let currentChatUser = null;
let chatUnsub = null;
let rtdbChatRef = null;
let rtdbChatUnsub = null;
let presenceUnsub = null;
let listenersReady = false;
let totalUnread = 0;
let replyTarget = null;

/* ============ NAV ============ */
const IS_EMBEDDED = window.self !== window.top;

/* ============ FLOATING HEARTS ============ */
(function(){
  const bg = $('heartsBg');
  const icons = ['❤️','💕','💗','🌸','✨','💖','🌹','💝'];
  for (let i = 0; i < 12; i++){
    const s = document.createElement('span');
    s.textContent = icons[Math.floor(Math.random()*icons.length)];
    s.style.left = Math.random()*100 + '%';
    s.style.animationDuration = (12 + Math.random()*10) + 's';
    s.style.animationDelay = (-Math.random()*20) + 's';
    s.style.fontSize = (12 + Math.random()*14) + 'px';
    bg.appendChild(s);
  }
})();

/* ============ STATUS ============ */
function setStatus(msg, type){
  const bar = $('statusBar');
  bar.textContent = msg;
  bar.className = 'status-bar' + (type ? ' ' + type : '');
}

/* ============ LOAD USER ============ */
function loadFromStorage(){
  try {
    const s = localStorage.getItem('moi_user');
    if (!s){ setStatus('❌ লগইন করুন', 'err'); return false; }
    const u = JSON.parse(s);
    if (!u || !u.uid){ setStatus('❌ ইউজার আইডি নেই', 'err'); return false; }
    me = { uid: u.uid, name: u.name || 'User', photo: u.photo || u.avatar || '', moiId: u.moiId || '' };
    renderMe();
    setStatus('✅ ' + me.name + ' • 🆔 ' + (me.moiId || me.uid.slice(0,8)), 'ok');
    return true;
  } catch(e){ setStatus('❌ ' + e.message, 'err'); return false; }
}

function renderMe(){
  $('myName').textContent = me.name || 'User';
  $('myUid').textContent = '🆔 ' + (me.moiId || me.uid.slice(0,8));
  const wrap = $('myAvWrap');
  if (me.photo){
    wrap.innerHTML = `<img src="${esc(me.photo)}" onerror="this.parentElement.innerHTML='👤'">`;
  } else wrap.innerHTML = '👤';
}

/* ============ AUTH FALLBACK ============ */
onAuthStateChanged(auth, async user => {
  if (user && !me){
    let name = user.displayName || 'User';
    let photo = user.photoURL || '';
    let moiId = '';
    try {
      const snap = await getDoc(doc(db, 'users', user.uid));
      if (snap.exists()){
        const u = snap.data();
        name = u.name || name; photo = u.photo || u.avatar || photo; moiId = u.moiId || '';
      }
    } catch(e){}
    me = { uid: user.uid, name, photo, moiId };
    renderMe();
    setStatus('✅ ' + me.name, 'ok');
    attachListeners();
  }
});

/* ============ ATTACH LISTENERS ============ */
function attachListeners(){
  if (listenersReady || !me) return;
  listenersReady = true;

  // Firestore: friends
  onSnapshot(collection(db, 'users', me.uid, 'friends'), snap => {
    friends = {};
    snap.forEach(d => friends[d.id] = d.data());
    Object.keys(friends).forEach(uid => loadProfile(uid));
    renderList();
    if (currentChatUid) updateChatHeader();
  }, err => setStatus('❌ Friends: ' + err.code, 'err'));

  // Firestore: sent requests
  onSnapshot(collection(db, 'users', me.uid, 'sentRequests'), snap => {
    sent = {};
    snap.forEach(d => sent[d.id] = true);
    renderList();
  });

  // Firestore: incoming requests
  onSnapshot(collection(db, 'friendRequests', me.uid, 'items'), snap => {
    requests = {};
    snap.forEach(d => requests[d.id] = d.data());
    const n = Object.keys(requests).length;
    const b = $('reqBadge');
    b.textContent = n;
    b.classList.toggle('show', n > 0);
    renderList();
  });

  // RTDB: userChatMeta (unread + lastMessage)
  rtOnValue(rtRef(rtdb, 'userChatMeta/' + me.uid), snap => {
    metas = snap.val() || {};
    totalUnread = 0;
    Object.values(metas).forEach(m => { totalUnread += (m.unread || 0); });
    const nb = $('navBadge');
    if (totalUnread > 0){
      nb.textContent = totalUnread > 99 ? '99+' : totalUnread;
      nb.classList.add('show');
    } else nb.classList.remove('show');
    document.title = totalUnread > 0 ? `(${totalUnread}) Chat` : 'Chat';
    renderList();
  });

  // RTDB: presence (all online users)
  rtOnValue(rtRef(rtdb, 'presence'), snap => {
    presence = snap.val() || {};
    renderList();
    if (currentChatUid) updateChatHeader();
  });

  // Set my presence
  const myPresRef = rtRef(rtdb, 'presence/' + me.uid);
  rtOnDisconnect(myPresRef).remove();
  rtSet(myPresRef, { name: me.name, uid: me.uid, time: Date.now() });

  // Re-presence every 30s
  setInterval(() => {
    rtSet(rtRef(rtdb, 'presence/' + me.uid), { name: me.name, uid: me.uid, time: Date.now() });
  }, 30000);
}

/* ============ LOAD PROFILE ============ */
async function loadProfile(uid){
  if (profiles[uid]) return profiles[uid];
  try {
    const snap = await getDoc(doc(db, 'users', uid));
    if (snap.exists()){
      profiles[uid] = { uid, ...snap.data() };
      renderList();
      return profiles[uid];
    }
  } catch(e){}
  profiles[uid] = { uid, name: 'User', photo: '' };
  return profiles[uid];
}

/* ============ TABS ============ */
let activeTab = 'friends';
window.switchTab = (t) => {
  activeTab = t;
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('active', x.dataset.tab === t));
  renderList();
};

/* ============ RENDER LIST ============ */
function renderList(){
  const area = $('listArea');
  if (!me){ area.innerHTML = '<div class="empty"><div class="big">🔒</div>লগইন প্রয়োজন</div>'; return; }

  if (activeTab === 'requests'){
    const list = Object.values(requests);
    if (!list.length){ area.innerHTML = '<div class="empty"><div class="big">📩</div>কোনো অনুরোধ নেই</div>'; return; }
    area.innerHTML = list.map(r => `
      <div class="req-card">
        <div class="av"><img src="${esc(r.fromPhoto || DEF_AV)}"></div>
        <div class="req-info"><div class="rn">${esc(r.fromName || 'User')}</div><div class="rt">বন্ধু হতে চায়</div></div>
        <div class="req-actions">
          <button class="acc" onclick="acceptReq('${esc(r.fromUid)}')">Accept</button>
          <button class="blk" onclick="blockReq('${esc(r.fromUid)}')">Block</button>
        </div>
      </div>`).join('');
    return;
  }

  const fUids = Object.keys(friends);
  if (!fUids.length){
    area.innerHTML = '<div class="empty"><div class="big">👥</div>এখনো কোনো বন্ধু নেই<br><br>উপরের 🔍 আইকনে ট্যাপ করে<br>নতুন বন্ধু খুঁজুন</div>';
    return;
  }

  const list = fUids.map(uid => {
    const meta = metas[uid] || {};
    const prof = profiles[uid] || null;
    const online = !!(presence && presence[uid]);
    return { uid, meta, prof, online };
  }).sort((a,b) => {
    if ((a.meta.unread||0) !== (b.meta.unread||0)) return (b.meta.unread||0) - (a.meta.unread||0);
    if (a.online !== b.online) return a.online ? -1 : 1;
    return (b.meta.lastTime || 0) - (a.meta.lastTime || 0);
  });

  area.innerHTML = list.map(({uid, meta, prof, online}) => {
    let preview = meta.lastMessage || 'কথা বলুন...';
    if (meta.lastType === 'image') preview = '📷 ছবি';
    else if (meta.lastType === 'audio') preview = '🎤 ভয়েস';
    else if (meta.lastType === 'emoji') preview = '💖 ইমোজি';

    const isMine = meta.lastSender === me.uid;
    const senderTag = isMine ? '<span class="lbl-sender">আপনি: </span>' : '';
    const timeStr = meta.lastTime ? timeAgo(meta.lastTime) : '';
    const unread = meta.unread || 0;
    const name = prof ? (prof.name || 'User') : 'লোড...';
    const photo = prof ? (prof.photo || prof.avatar || '') : '';

    return `<div class="user-item" onclick="openChat('${esc(uid)}')">
      <div class="u-avatar">
        ${photo ? `<img src="${esc(photo)}" onerror="this.parentElement.innerHTML='👤'">` : '👤'}
        <div class="status-dot ${online ? 'online' : ''}"></div>
      </div>
      <div class="u-info">
        <div class="u-name">${esc(name)}</div>
        <div class="u-last">${senderTag}${esc(preview)}</div>
      </div>
      <div class="u-meta">
        <div class="u-time">${esc(timeStr)}</div>
        ${unread > 0 ? `<div class="u-unread">${unread > 99 ? '99+' : unread}</div>` : ''}
      </div>
    </div>`;
  }).join('');
}

function timeAgo(ts){
  const m = Math.floor((Date.now() - ts) / 60000);
  if (m < 1) return 'এইমাত্র';
  if (m < 60) return m + 'মি';
  const h = Math.floor(m / 60);
  if (h < 24) return h + 'ঘ';
  const d = Math.floor(h / 24);
  return d + 'দিন';
}

/* ============ FRIEND REQUESTS ============ */
window.acceptReq = async (uid) => {
  try {
    await setDoc(doc(db, 'users', me.uid, 'friends', uid), { since: Date.now() });
    await setDoc(doc(db, 'users', uid, 'friends', me.uid), { since: Date.now() });
    await deleteDoc(doc(db, 'friendRequests', me.uid, 'items', uid));
    await deleteDoc(doc(db, 'users', uid, 'sentRequests', me.uid));
    toast('🎉 বন্ধু হয়েছে');
  } catch(e){ toast('❌ ' + e.message); }
};

window.blockReq = async (uid) => {
  try {
    await deleteDoc(doc(db, 'friendRequests', me.uid, 'items', uid));
    await deleteDoc(doc(db, 'users', uid, 'sentRequests', me.uid));
    toast('🚫 ব্লক');
  } catch(e){ toast('❌ ' + e.message); }
};

/* ============ CHAT ID ============ */
function chatId(a, b){ return [a, b].sort().join('__'); }

/* ============ OPEN CHAT ============ */
window.openChat = async (uid) => {
  if (!me || !uid || uid === me.uid) return;
  detachChat();

  currentChatUid = uid;
  const prof = await loadProfile(uid);
  currentChatUser = prof;

  $('chatName').textContent = prof.name || 'User';
  $('chatAv').src = prof.photo || prof.avatar || DEF_AV;
  $('chatBody').innerHTML = '';
  $('chatScreen').classList.add('show');
  cancelReply();

  updateChatHeader();

  // Mark unread = 0 in RTDB
  try { await rtSet(rtRef(rtdb, `userChatMeta/${me.uid}/${uid}/unread`), 0); } catch(e){}

  const cid = chatId(me.uid, uid);
  rtdbChatRef = rtRef(rtdb, `chats/${cid}/messages`);
  const q = rtQuery(rtdbChatRef, rtLimitToLast(200));

  rtdbChatUnsub = rtOnValue(q, snap => {
    const data = snap.val() || {};
    const arr = Object.entries(data).map(([k, v]) => ({ key: k, ...v })).sort((a,b) => (a.ts||0) - (b.ts||0));

    // Full re-render
    $('chatBody').innerHTML = '';
    arr.forEach(msg => {
      renderMessage(msg, msg.key);
      // Mark as read if from other
      if (msg.senderUid && msg.senderUid !== me.uid){
        rtUpdate(rtRef(rtdb, `chats/${cid}/messages/${msg.key}`), {
          [`deliveredTo/${me.uid}`]: true,
          [`readBy/${me.uid}`]: true
        }).catch(()=>{});
      }
    });
    setTimeout(() => { $('chatBody').scrollTop = $('chatBody').scrollHeight; }, 50);
  });

  // Presence listener (for header dot)
  presenceUnsub = rtOnValue(rtRef(rtdb, 'presence'), () => updateChatHeader());

  setTimeout(() => $('msgInput').focus(), 250);
};

function updateChatHeader(){
  if (!currentChatUid) return;
  const online = !!(presence && presence[currentChatUid]);
  const dot = $('chatStDot');
  if (online){
    dot.classList.add('online');
    $('chatSub').textContent = '● Online';
  } else {
    dot.classList.remove('online');
    $('chatSub').textContent = 'Offline';

/* ============ RENDER MESSAGE ============ */
function renderMessage(data, key){
  if (data.deletedFor && Array.isArray(data.deletedFor) && data.deletedFor.includes(me.uid)) return;

  const isMe = data.senderUid === me.uid;
  const wrap = document.createElement('div');
  wrap.className = 'msg-wrap ' + (isMe ? 'out' : 'in');
  wrap.dataset.key = key;
  wrap.dataset.isMe = isMe ? '1' : '0';

  // Tick
  let tick = '';
  if (isMe){
    if (data.readBy && Object.keys(data.readBy).length > 0 && !data.readBy[me.uid]){
      tick = '<i class="fa-solid fa-circle-check tick" style="color:#7fe6ff"></i>';
    } else if (data.deliveredTo && Object.keys(data.deliveredTo).length > 0){
      tick = '<i class="fa-solid fa-check-double tick" style="opacity:.9"></i>';
    } else {
      tick = '<i class="fa-solid fa-check tick" style="opacity:.7"></i>';
    }
  }

  // Quote
  let quote = '';
  if (data.replyTo){
    const r = data.replyTo;
    quote = `<div class="quote-box"><div class="quote-name">${esc(r.senderName||'')}</div><div class="quote-text">${esc(r.preview||'')}</div></div>`;
  }

  const t = data.type || 'text';
  let body = '';
  if (t === 'text') body = esc(data.content || '');
  else if (t === 'image') body = `<img src="${data.content}">`;
  else if (t === 'emoji') {
    wrap.innerHTML = `<div class="bubble emoji-only ${isMe?'out':'in'}">${quote}<img class="emoji-big" src="${emojiUrl(data.emojiCode)}" alt=""><div class="mt" style="justify-content:center;opacity:.6">${esc(data.time||'')}${tick}</div></div>`;
    attachSwipe(wrap, data, key);
    attachLongPress(wrap, data, key, isMe);
    $('chatBody').appendChild(wrap);
    return;
  }
  else if (t === 'audio') {
    body = `<div class="voice-player">
      <button class="vp-play"><i class="fa-solid fa-play"></i></button>
      <div class="vp-bar"><div class="vp-bar-inner"></div></div>
      <span class="vp-time">${fmtTime(data.duration||0)}</span>
      <audio preload="metadata" src="${data.content}"></audio>
    </div>`;
  }

  wrap.innerHTML = `<div class="bubble ${isMe?'out':'in'}">${quote}${body}<div class="mt">${esc(data.time||'')}${tick}</div></div>`;
  if (t === 'audio') setupVoicePlayer(wrap);
  attachSwipe(wrap, data, key);
  attachLongPress(wrap, data, key, isMe);
  $('chatBody').appendChild(wrap);
}

function attachSwipe(el, data, key){
  let sx=0, sy=0, sw=false;
  el.addEventListener('touchstart', e => {
    const t = e.touches[0]; sx = t.clientX; sy = t.clientY; sw = true;
  }, {passive:true});
  el.addEventListener('touchmove', e => {
    if (!sw) return;
    const t = e.touches[0];
    const dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.abs(dy) > 30){ sw = false; return; }
    if (dx > 20 && Math.abs(dx) > Math.abs(dy)) el.style.transform = `translateX(${Math.min(dx,60)}px)`;
  }, {passive:true});
  el.addEventListener('touchend', e => {
    if (!sw){ el.style.transform = ''; return; }
    const t = e.changedTouches[0];
    if (t.clientX - sx > 55){ setReply(data, key); if (navigator.vibrate) navigator.vibrate(20); }
    el.style.transform = '';
    sw = false;
  });
}

function attachLongPress(el, data, key, isMe){
  let timer = null;
  const open = () => openActionSheet(key, data, isMe);
  const clear = () => { if (timer){ clearTimeout(timer); timer = null; } };
  el.addEventListener('touchstart', () => { timer = setTimeout(open, 550); }, {passive:true});
  el.addEventListener('touchend', clear);
  el.addEventListener('touchmove', clear);
  el.addEventListener('contextmenu', e => { e.preventDefault(); open(); });
}

function setReply(data, key){
  let preview = '';
  if (data.type === 'text') preview = data.content || '';
  else if (data.type === 'image') preview = '📷 ছবি';
  else if (data.type === 'audio') preview = '🎤 ভয়েস';
  else if (data.type === 'emoji') preview = '💖 ইমোজি';
  replyTarget = { key, senderName: data.senderUid === me.uid ? 'আপনি' : (data.senderName || ''), preview };
  $('replyName').textContent = '↩ ' + replyTarget.senderName;
  $('replyText').textContent = preview;
  $('replyBar').classList.add('show');
  $('msgInput').focus();
}
window.cancelReply = (e) => {
  if (e) e.stopPropagation();
  replyTarget = null;
  $('replyBar').classList.remove('show');
};

/* ============ VOICE PLAYER ============ */
function setupVoicePlayer(wrap){
  const btn = wrap.querySelector('.vp-play');
  const audio = wrap.querySelector('audio');
  const barI = wrap.querySelector('.vp-bar-inner');
  const time = wrap.querySelector('.vp-time');
  const icon = btn.querySelector('i');
  if (!audio) return;
  audio.addEventListener('timeupdate', () => {
    if (audio.duration && isFinite(audio.duration)){
      barI.style.width = (audio.currentTime / audio.duration * 100) + '%';
      time.textContent = fmtTime(audio.currentTime);
    }
  });
  audio.addEventListener('ended', () => { icon.className = 'fa-solid fa-play'; barI.style.width = '0%'; });
  btn.addEventListener('click', e => {
    e.stopPropagation();
    if (audio.paused){ audio.play(); icon.className = 'fa-solid fa-pause'; }
    else { audio.pause(); icon.className = 'fa-solid fa-play'; }
  });
}

/* ============ ACTION SHEET ============ */
let sheetKey = null, sheetData = null, sheetIsMe = false;
function openActionSheet(key, data, isMe){
  sheetKey = key; sheetData = data; sheetIsMe = isMe;
  // Simple confirm based
  const opts = ['Reply', isMe ? 'Delete for everyone' : null, 'Delete for me'].filter(Boolean);
  const choice = prompt(`Action:\n1. Reply\n2. Delete for me${isMe ? '\n3. Delete for everyone' : ''}\n\nType number:`);
  if (!choice) return;
  if (choice === '1') setReply(data, key);
  else if (choice === '2') deleteMsg('me');
  else if (choice === '3' && isMe) deleteMsg('all');
}

async function deleteMsg(mode){
  if (!sheetKey || !currentChatUid) return;
  const cid = chatId(me.uid, currentChatUid);
  try {
    if (mode === 'all'){
      await rtRemove(rtRef(rtdb, `chats/${cid}/messages/${sheetKey}`));
      toast('🌐 সবার জন্য ডিলিট');
    } else {
      const cur = (sheetData.deletedFor && Array.isArray(sheetData.deletedFor)) ? sheetData.deletedFor : [];
      if (!cur.includes(me.uid)) cur.push(me.uid);
      await rtUpdate(rtRef(rtdb, `chats/${cid}/messages/${sheetKey}`), { deletedFor: cur });
      toast('✅ ডিলিট হয়েছে');
    }
  } catch(e){ toast('❌ ' + e.message); }
  sheetKey = null; sheetData = null; sheetIsMe = false;
}

/* ============ SEND MESSAGES ============ */
async function pushMsg(payload){
  if (!currentChatUid) return;
  const cid = chatId(me.uid, currentChatUid);
  payload.senderUid = me.uid;
  payload.senderName = me.name;
  payload.time = new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
  payload.ts = Date.now();
  payload.deliveredTo = { [me.uid]: true };
  if (replyTarget) payload.replyTo = replyTarget;

  await rtPush(rtRef(rtdb, `chats/${cid}/messages`), payload);

  // Meta update
  let preview = '';
  if (payload.type === 'text') preview = payload.content;
  else if (payload.type === 'image') preview = '📷 ছবি';
  else if (payload.type === 'audio') preview = '🎤 ভয়েস';
  else if (payload.type === 'emoji') preview = '💖 ইমোজি';

  const now = Date.now();
  const meta = { lastMessage: preview, lastTime: now, lastSender: me.uid, lastType: payload.type };
  await rtUpdate(rtRef(rtdb, `userChatMeta/${me.uid}/${currentChatUid}`), meta);
  await rtUpdate(rtRef(rtdb, `userChatMeta/${currentChatUid}/${me.uid}`), meta);

  // Increment unread on recipient
  const theirUnreadRef = rtRef(rtdb, `userChatMeta/${currentChatUid}/${me.uid}/unread`);
  const snap = await rtGet(theirUnreadRef);
  const curUnread = snap.val() || 0;
  await rtSet(theirUnreadRef, curUnread + 1);

  cancelReply();
}

window.sendText = () => {

window.sendFile = (e, type) => {

};

/* ============ RECORDING ============ */
let mediaRecorder = null, chunks = [], isRec = false, recTimer = null, recStart = 0;
window.toggleRec = async () => { if (isRec) stopRec(); else await startRec(); };
async function startRec(){
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio:true });
    chunks = [];
    let mime = '';
    if (MediaRecorder.isTypeSupported('audio/webm;codecs=opus')) mime = 'audio/webm;codecs=opus';
    else if (MediaRecorder.isTypeSupported('audio/webm')) mime = 'audio/webm';
    mediaRecorder = mime ? new MediaRecorder(stream, { mimeType: mime }) : new MediaRecorder(stream);
    mediaRecorder.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
    mediaRecorder.onstop = () => {
      stream.getTracks().forEach(t => t.stop());
      const blob = new Blob(chunks, { type: mime || 'audio/webm' });
      const dur = Math.round((Date.now() - recStart) / 1000);
      if (blob.size < 800 || dur < 1){ resetRec(); return; }
      const rd = new FileReader();
      rd.onload = () => { pushMsg({ type: 'audio', content: rd.result, duration: dur }); };
      rd.readAsDataURL(blob);
      resetRec();
    };
    mediaRecorder.start();
    isRec = true;
    recStart = Date.now();
    $('micBtn').classList.add('recording');
    $('recBar').classList.add('show');
    $('recTime').textContent = '00:00';
    recTimer = setInterval(() => { $('recTime').textContent = fmtTime(Math.floor((Date.now()-recStart)/1000)); }, 250);
  } catch(e){ alert('মাইক নেই: ' + e.message); resetRec(); }
}
window.stopRec = () => { if (mediaRecorder && isRec){ try { mediaRecorder.stop(); } catch(e){} isRec = false; } };
window.cancelRec = () => {
  if (mediaRecorder && isRec){ mediaRecorder.onstop = null; try { mediaRecorder.stop(); } catch(e){} isRec = false; }
  resetRec();
};
function resetRec(){
  isRec = false;
  if (recTimer){ clearInterval(recTimer); recTimer = null; }
  $('micBtn').classList.remove('recording');
  $('recBar').classList.remove('show');
  mediaRecorder = null; chunks = [];
}

/* ============ AUDIO CALL (WebRTC) ============ */
const rtcConfig = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:stun1.l.google.com:19302' }] };
let pc = null, localStream = null, activeCallId = null, isInCall = false;
let incomingCallData = null;

window.startCall = async () => {
  if (!currentChatUid){ toast('আগে চ্যাট খুলুন'); return; }
  if (isInCall){ toast('ইতিমধ্যে কলে আছেন'); return; }
  isInCall = true;
  activeCallId = chatId(me.uid, currentChatUid) + '_' + Date.now();
  $('activeCallAvatar').src = currentChatUser?.photo || DEF_AV;
  $('activeCallName').textContent = currentChatUser?.name || 'User';
  $('activeCallStatus').textContent = 'রিং হচ্ছে...';
  $('activeCallOverlay').classList.add('show');

  try {
    localStream = await navigator.mediaDevices.getUserMedia({ audio:true });
    pc = new RTCPeerConnection(rtcConfig);
    localStream.getTracks().forEach(t => pc.addTrack(t, localStream));
    pc.onicecandidate = e => {
      if (e.candidate) rtPush(rtRef(rtdb, `callSignal/${activeCallId}/callerCandidates`), e.candidate.toJSON());
    };
    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);

    await rtSet(rtRef(rtdb, `callSignal/${activeCallId}`), {
      callerUid: me.uid, callerName: me.name, callerPhoto: me.photo,
      targetUid: currentChatUid,
      status: 'ringing',
      offer: { type: offer.type, sdp: offer.sdp },
      ts: Date.now()
    });

    rtOnValue(rtRef(rtdb, `callSignal/${activeCallId}`), async snap => {
      const sig = snap.val();
      if (!sig) return;
      if (sig.status === 'rejected' || sig.status === 'ended'){ hangupCall(); return; }
      if (sig.answer && pc && !pc.currentRemoteDescription){
        await pc.setRemoteDescription(new RTCSessionDescription(sig.answer));
        $('activeCallStatus').textContent = '🎧 সংযুক্ত';
      }
    });
    rtOnValue(rtRef(rtdb, `callSignal/${activeCallId}/calleeCandidates`), snap => {
      snap.forEach(c => { if (c.val() && pc) pc.addIceCandidate(new RTCIceCandidate(c.val())).catch(()=>{}); });
    });
  } catch(e){ toast('কল ব্যর্থ: ' + e.message); hangupCall(); }
};

window.hangupCall = () => {
  if (activeCallId){
    rtUpdate(rtRef(rtdb, `callSignal/${activeCallId}`), { status: 'ended' }).catch(()=>{});
    setTimeout(() => rtRemove(rtRef(rtdb, `callSignal/${activeCallId}`)).catch(()=>{}), 500);
  }
  if (pc){ pc.close(); pc = null; }
  if (localStream){ localStream.getTracks().forEach(t => t.stop()); localStream = null; }
  isInCall = false; activeCallId = null;
  $('activeCallOverlay').classList.remove('show');
  $('incomingOverlay').classList.remove('show');
};

window.toggleMute = () => {
  if (!localStream) return;
  const t = localStream.getAudioTracks()[0];
  if (t){ t.enabled = !t.enabled; $('muteBtn').style.opacity = t.enabled ? '1' : '.5'; }
};

// Listen for incoming calls
rtOnValue(rtRef(rtdb, 'callSignal'), snap => {
  const data = snap.val() || {};
  Object.entries(data).forEach(([id, sig]) => {
    if (!sig || sig.targetUid !== me?.uid || sig.status !== 'ringing' || isInCall) return;
    if (Date.now() - sig.ts > 60000){ rtRemove(rtRef(rtdb, `callSignal/${id}`)); return; }
    incomingCallData = { id, ...sig };
    $('incomingAvatar').src = sig.callerPhoto || DEF_AV;
    $('incomingName').textContent = sig.callerName || 'Unknown';
    $('incomingOverlay').classList.add('show');
  });
});

window.acceptCall = async () => {
  if (!incomingCallData) return;
  const sig = incomingCallData;
  incomingCallData = null;
  $('incomingOverlay').classList.remove('show');
  isInCall = true;
  activeCallId = sig.id;
  $('activeCallAvatar').src = sig.callerPhoto || DEF_AV;
  $('activeCallName').textContent = sig.callerName || 'Unknown';
  $('activeCallStatus').textContent = 'সংযুক্ত হচ্ছে...';
  $('activeCallOverlay').classList.add('show');

  try {
    localStream = await navigator.mediaDevices.getUserMedia({ audio:true });
    pc = new RTCPeerConnection(rtcConfig);
    localStream.getTracks().forEach(t => pc.addTrack(t, localStream));
    pc.onicecandidate = e => {
      if (e.candidate) rtPush(rtRef(rtdb, `callSignal/${sig.id}/calleeCandidates`), e.candidate.toJSON());
    };
    await pc.setRemoteDescription(new RTCSessionDescription(sig.offer));
    const ans = await pc.createAnswer();
    await pc.setLocalDescription(ans);
    await rtUpdate(rtRef(rtdb, `callSignal/${sig.id}`), { answer: { type: ans.type, sdp: ans.sdp }, status: 'accepted' });
    rtOnValue(rtRef(rtdb, `callSignal/${sig.id}/callerCandidates`), s => {
      s.forEach(c => { if (c.val() && pc) pc.addIceCandidate(new RTCIceCandidate(c.val())).catch(()=>{}); });
    });
    $('activeCallStatus').textContent = '🎧 সংযুক্ত';
  } catch(e){ toast('কল ব্যর্থ: ' + e.message); hangupCall(); }
};

window.rejectCall = () => {
  if (incomingCallData){
    rtUpdate(rtRef(rtdb, `callSignal/${incomingCallData.id}`), { status: 'rejected' });
    incomingCallData = null;
  }
  $('incomingOverlay').classList.remove('show');
};

async function doSearch(q){
  const results = [];
  try {
    if (/^\d{4,10}$/.test(q)){
      try {
        const snap = await getDocs(query(collection(db, 'users'), where('moiId', '==', q), limit(10)));
        snap.forEach(d => results.push({ uid: d.id, ...d.data() }));
      } catch(e){}
    }
    try {
      const snap = await getDocs(query(collection(db, 'users'),
        where('name', '>=', q), where('name', '<=', q + '\uf8ff'), limit(20)));
      snap.forEach(d => { if (!results.find(r => r.uid === d.id)) results.push({ uid: d.id, ...d.data() }); });
    } catch(e){}
  } catch(e){}

  const body = $('searchBody');
  if (!results.length){ body.innerHTML = '<div class="empty"><div class="big">😔</div>কেউ পাওয়া যায়নি</div>'; return; }

  body.innerHTML = results.map(u => {
    const isMe = u.uid === me.uid;
    const isFr = !!friends[u.uid];
    const isSent = !!sent[u.uid];
    const isReq = !!requests[u.uid];

    let btn = '';
    if (isMe) btn = `<button class="res-btn self">You</button>`;
    else if (isFr) btn = `<button class="res-btn friend" onclick="closeSearch();setTimeout(()=>openChat('${u.uid}'),200)">Message</button>`;
    else if (isReq) btn = `<button class="res-btn incoming" onclick="acceptReq('${u.uid}').then(()=>doSearch('${esc(q)}'))">Accept</button>`;
    else if (isSent) btn = `<button class="res-btn sent">Sent</button>`;
    else btn = `<button class="res-btn add" onclick="sendReq('${u.uid}', this)">+ Add</button>`;

    return `<div class="res-card">
      <img src="${esc(u.photo || u.avatar || DEF_AV)}" onerror="this.src='${DEF_AV}'">
      <div class="res-info">
        <div class="res-name">${esc(u.name || 'User')}</div>
        <div class="res-id">🆔 ${esc(u.moiId || u.uid.slice(0,8))}</div>
      </div>
      ${btn}
    </div>`;
  }).join('');
}

window.sendReq = async (uid, btn) => {
  if (!me || uid === me.uid) return;
  btn.disabled = true; btn.textContent = '...';
  try {
    await setDoc(doc(db, 'friendRequests', uid, 'items', me.uid), {

};

function fmtTime(sec){

  const s = Math.floor(sec);
  return Math.floor(s/60) + ':' + String(s%60).padStart(2,'0');
}

  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}
