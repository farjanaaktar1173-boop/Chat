<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MOI Chat</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',system-ui,'Noto Sans Bengali',Tahoma,sans-serif;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{background:#0a0616;display:flex;justify-content:center;align-items:center;height:100dvh;overflow:hidden;color:#fff;position:relative;}
.bg-orbs{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;}
.bg-orbs span{position:absolute;border-radius:50%;filter:blur(90px);opacity:.5;}
.bg-orbs span:nth-child(1){width:340px;height:340px;background:#a855f7;top:-90px;left:-90px;animation:float1 16s ease-in-out infinite;}
.bg-orbs span:nth-child(2){width:300px;height:300px;background:#6366f1;bottom:-100px;right:-80px;animation:float2 19s ease-in-out infinite;}
.bg-orbs span:nth-child(3){width:260px;height:260px;background:#ec4899;top:45%;left:58%;animation:float3 22s ease-in-out infinite;opacity:.4;}
@keyframes float1{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(80px,60px) scale(1.25);}}
@keyframes float2{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(-70px,-70px) scale(1.18);}}
@keyframes float3{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(-90px,50px) scale(1.3);}}

/* ============ LOGIN OVERLAY ============ */
.login-overlay{position:fixed;inset:0;z-index:1000;display:none;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%,#2a1055,#0a0318);padding:30px;text-align:center;}
.login-overlay.show{display:flex;}
.login-card{max-width:340px;}
.login-icon{width:110px;height:110px;margin:0 auto 22px;border-radius:50%;display:grid;place-items:center;font-size:44px;background:radial-gradient(circle at 30% 30%,#a855f7,#4a105a);border:3px solid #F5D76E;box-shadow:0 0 40px rgba(245,215,110,.55);animation:slowSpin 8s linear infinite;}
@keyframes slowSpin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.login-card h1{font-size:24px;font-weight:700;margin-bottom:8px;background:linear-gradient(100deg,#a8fbff,#00f2fe,#a78bfa,#ff2a85);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
.login-card p{font-size:13.5px;color:#9c8fb0;margin-bottom:28px;line-height:1.6;}
.login-btn{display:inline-flex;align-items:center;gap:12px;background:#fff;color:#1f1f1f;padding:14px 30px;border-radius:50px;font-size:15px;font-weight:600;border:none;cursor:pointer;box-shadow:0 6px 25px rgba(255,255,255,.15);}
.login-btn i{font-size:20px;color:#4285F4;}

/* ============ MAIN SCREEN ============ */
.screen{width:100%;max-width:480px;height:100dvh;display:none;flex-direction:column;background:rgba(20,10,32,.92);backdrop-filter:blur(22px);box-shadow:0 34px 90px rgba(168,85,247,.35);overflow:hidden;position:relative;z-index:2;}
@media(min-width:520px){.screen{height:92dvh;border-radius:28px;border:1px solid rgba(168,85,247,.25);}}
.screen.show{display:flex;}

/* Header */
.header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:linear-gradient(135deg,rgba(168,85,247,.4),rgba(99,102,241,.25));border-bottom:1px solid rgba(168,85,247,.2);flex-shrink:0;gap:10px;}
.my-profile{display:flex;align-items:center;gap:10px;min-width:0;padding:4px 6px;border-radius:14px;}
.my-profile .my-av{width:42px;height:42px;border-radius:50%;overflow:hidden;border:2px solid rgba(245,215,110,.6);box-shadow:0 0 12px rgba(245,215,110,.4);flex-shrink:0;}
.my-profile .my-av img{width:100%;height:100%;object-fit:cover;}
.my-profile .my-info{min-width:0;}
.my-profile .my-info .mname{font-size:14px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px;}
.my-profile .my-info .muid{font-size:9.5px;color:rgba(200,215,235,.75);font-family:monospace;margin-top:1px;}
.hdr-actions{display:flex;gap:8px;}
.icon-btn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:rgba(168,85,247,.15);border:1px solid rgba(168,85,247,.3);color:#d8b4fe;font-size:14px;cursor:pointer;transition:.25s;}
.icon-btn:hover{background:linear-gradient(135deg,#a855f7,#6366f1);color:#fff;}

/* Tabs */
.tabs{display:flex;padding:10px 14px 0;gap:8px;flex-shrink:0;border-bottom:1px solid rgba(168,85,247,.15);}
.tab{flex:1;padding:11px 6px;text-align:center;font-size:13px;font-weight:600;color:rgba(200,215,235,.6);cursor:pointer;border-bottom:2px solid transparent;transition:.2s;position:relative;}
.tab.active{color:#fff;border-bottom-color:#F5D76E;}
.tab .tab-badge{position:absolute;top:6px;right:calc(50% - 34px);background:linear-gradient(135deg,#ef4444,#dc2626);color:#fff;font-size:10px;font-weight:700;min-width:18px;height:18px;border-radius:9px;padding:0 5px;display:none;place-items:center;box-shadow:0 2px 8px rgba(239,68,68,.7);}
.tab .tab-badge.show{display:grid;}

/* Search */
.search-wrap{padding:12px 14px 6px;flex-shrink:0;}
.search-wrap input{width:100%;padding:11px 16px;border-radius:22px;border:1px solid rgba(168,85,247,.3);background:rgba(168,85,247,.1);color:#fff;font-size:13.5px;outline:none;font-family:inherit;}
.search-wrap input::placeholder{color:rgba(200,215,235,.5);}
.search-wrap input:focus{border-color:rgba(245,215,110,.6);}

/* List area */
.list-area{flex:1;overflow-y:auto;padding:4px 0 20px;}
.list-area::-webkit-scrollbar{width:5px;}
.list-area::-webkit-scrollbar-thumb{background:rgba(168,85,247,.35);border-radius:10px;}

.section-title{padding:10px 18px 6px;font-size:11px;color:rgba(200,215,235,.7);font-weight:700;letter-spacing:.6px;text-transform:uppercase;}

/* User item */
.user-item{display:flex;align-items:center;gap:12px;padding:11px 16px;cursor:pointer;transition:.2s;position:relative;}
.user-item:hover{background:rgba(168,85,247,.1);}
.user-item:active{transform:scale(.985);}
.user-item .u-avatar{width:52px;height:52px;border-radius:50%;position:relative;flex-shrink:0;}
.user-item .u-avatar img{width:100%;height:100%;border-radius:50%;object-fit:cover;border:2px solid rgba(168,85,247,.35);}
.user-item .u-avatar .status-dot{position:absolute;bottom:2px;right:2px;width:13px;height:13px;border-radius:50%;background:#6b7280;border:2.5px solid #1a0b22;}
.user-item .u-avatar .status-dot.online{background:#22c55e;box-shadow:0 0 10px rgba(34,197,94,.9);animation:onlinePulse 2s ease-in-out infinite;}
@keyframes onlinePulse{0%,100%{box-shadow:0 0 0 0 rgba(34,197,94,.85);}50%{box-shadow:0 0 0 6px rgba(34,197,94,0);}}
.user-item .u-info{flex:1;min-width:0;}
.user-item .u-info .u-name{font-size:15px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.user-item .u-info .u-last{font-size:12.5px;color:rgba(255,255,255,.55);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px;}
.user-item .u-info .u-last .lbl-online{color:#4ade80;font-weight:600;}
.user-item .u-info .u-last .lbl-offline{color:rgba(255,255,255,.5);}
.user-item .u-info .u-last .lbl-sender{color:#c4b5fd;font-weight:600;}
.user-item .u-meta{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex-shrink:0;}
.user-item .u-meta .u-time{font-size:11px;color:rgba(200,215,235,.6);}
.user-item .u-meta .u-unread{background:linear-gradient(135deg,#22c55e,#16a34a);color:#fff;font-size:11px;font-weight:700;min-width:22px;height:22px;border-radius:11px;padding:0 7px;display:grid;place-items:center;box-shadow:0 4px 12px rgba(34,197,94,.7);animation:badgePop .3s cubic-bezier(.2,.8,.2,1.5);}
@keyframes badgePop{0%{transform:scale(0);}70%{transform:scale(1.2);}100%{transform:scale(1);}}

/* Empty state */
.empty{text-align:center;padding:60px 20px;color:rgba(255,255,255,.5);font-size:14px;line-height:1.6;}
.empty .big{font-size:52px;margin-bottom:12px;opacity:.6;}

/* Friend request card */
.req-card{display:flex;align-items:center;gap:12px;padding:12px 16px;margin:6px 14px;border-radius:16px;background:rgba(168,85,247,.08);border:1px solid rgba(168,85,247,.2);}
.req-card img{width:52px;height:52px;border-radius:50%;object-fit:cover;border:2px solid rgba(245,215,110,.5);flex-shrink:0;}
.req-card .req-info{flex:1;min-width:0;}
.req-card .req-info .rn{font-size:14px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.req-card .req-info .rt{font-size:11.5px;color:rgba(200,215,235,.7);margin-top:2px;}
.req-card .req-actions{display:flex;gap:6px;flex-shrink:0;}
.req-card button{padding:8px 12px;border:none;border-radius:10px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;transition:.2s;}
.req-card .acc{background:linear-gradient(135deg,#22c55e,#16a34a);color:#fff;}
.req-card .blk{background:rgba(255,255,255,.08);color:#ff8a9c;border:1px solid rgba(239,68,68,.3);}

/* ============ CHAT SCREEN ============ */
.chat-screen{width:100%;max-width:480px;height:100dvh;display:none;flex-direction:column;background:rgba(20,10,32,.85);backdrop-filter:blur(22px);box-shadow:0 34px 90px rgba(168,85,247,.35);overflow:hidden;position:relative;z-index:2;}
@media(min-width:520px){.chat-screen{height:92dvh;border-radius:28px;border:1px solid rgba(168,85,247,.25);}}
.chat-screen.show{display:flex;}

.chat-header{display:flex;align-items:center;padding:12px 14px;background:linear-gradient(135deg,rgba(168,85,247,.4),rgba(99,102,241,.25));border-bottom:1px solid rgba(168,85,247,.2);flex-shrink:0;gap:10px;}
.back-btn{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#d8b4fe;font-size:16px;cursor:pointer;flex-shrink:0;transition:.2s;}
.back-btn:hover{background:rgba(168,85,247,.3);}
.chat-header .av-wrap{position:relative;width:44px;height:44px;flex-shrink:0;}
.chat-header .av-wrap img{width:100%;height:100%;border-radius:50%;object-fit:cover;border:2px solid rgba(245,215,110,.5);box-shadow:0 0 12px rgba(245,215,110,.4);}
.chat-header .av-wrap::after{content:'';position:absolute;bottom:1px;right:1px;width:12px;height:12px;border-radius:50%;background:#6b7280;border:2px solid #1a0b22;}
.chat-header .av-wrap.online::after{background:#22c55e;box-shadow:0 0 8px rgba(34,197,94,.9);}
.chat-header .chat-info{flex:1;min-width:0;}
.chat-header .chat-info .cn{font-size:14.5px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.chat-header .chat-info .cs{font-size:11px;color:rgba(200,215,235,.75);margin-top:1px;}
.chat-header .hdr-btns{display:flex;gap:6px;flex-shrink:0;}

.chat-body{flex:1;padding:18px 14px;overflow-y:auto;display:flex;flex-direction:column;gap:12px;background:radial-gradient(circle at 15% 10%,rgba(168,85,247,.1),transparent 45%),radial-gradient(circle at 85% 85%,rgba(236,72,153,.08),transparent 45%);scroll-behavior:smooth;}
.chat-body::-webkit-scrollbar{width:6px;}
.chat-body::-webkit-scrollbar-thumb{background:rgba(168,85,247,.35);border-radius:10px;}

/* Messages */
.msg-wrap{display:flex;flex-direction:column;max-width:80%;animation:popIn .4s cubic-bezier(.18,.89,.32,1.28) both;cursor:pointer;position:relative;transition:transform .15s;}
@keyframes popIn{from{opacity:0;transform:translateY(14px) scale(.94);}to{opacity:1;transform:translateY(0) scale(1);}}
.msg-wrap.outgoing{align-self:flex-end;align-items:flex-end;}
.msg-wrap.incoming{align-self:flex-start;align-items:flex-start;}
.msg-wrap:active{transform:scale(.98);}
.msg-bubble{padding:10px 14px;border-radius:19px;font-size:14.5px;line-height:1.55;word-wrap:break-word;width:100%;box-shadow:0 8px 22px rgba(0,0,0,.3);position:relative;}
.msg-bubble.incoming{background:linear-gradient(160deg,rgba(255,255,255,.11),rgba(255,255,255,.05));border:1px solid rgba(168,85,247,.2);color:#eaeaff;border-bottom-left-radius:6px;}
.msg-bubble.outgoing{background:linear-gradient(135deg,#a855f7,#6366f1);color:#fff;border-bottom-right-radius:6px;box-shadow:0 10px 26px rgba(168,85,247,.45);}
.msg-bubble img,.msg-bubble video{max-width:100%;border-radius:12px;margin-top:5px;display:block;}
.msg-time{font-size:10px;margin-top:5px;opacity:.72;text-align:right;display:flex;align-items:center;justify-content:flex-end;gap:5px;}
.msg-bubble.incoming .msg-time{text-align:left;justify-content:flex-start;}
.tick{font-size:11px;}
.tick-sent{color:rgba(255,255,255,.7);}
.tick-delivered{color:rgba(255,255,255,.9);}
.tick-seen{color:#7fe6ff;}

/* Emoji-only message */
.emoji-msg{padding:6px !important;background:transparent !important;border:none !important;box-shadow:none !important;}
.emoji-msg .e{font-size:52px;line-height:1;text-align:center;display:block;}

/* Voice player */
.voice-player{display:flex;align-items:center;gap:10px;padding:4px 2px;min-width:200px;}
.voice-player .vp-play{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.22);border:none;color:#fff;cursor:pointer;display:grid;place-items:center;font-size:15px;flex-shrink:0;}
.voice-player .vp-bar{flex:1;height:6px;border-radius:3px;background:rgba(255,255,255,.22);overflow:hidden;position:relative;cursor:pointer;min-width:70px;}
.voice-player .vp-bar-inner{height:100%;width:0%;background:linear-gradient(90deg,#c4b5fd,#fff);border-radius:3px;transition:width .1s linear;}
.voice-player .vp-time{font-size:11.5px;opacity:.92;font-variant-numeric:tabular-nums;min-width:42px;text-align:right;font-weight:700;}

/* Reply preview */
.reply-bar{display:none;align-items:center;gap:10px;padding:10px 14px;background:rgba(168,85,247,.15);border-top:1px solid rgba(168,85,247,.3);position:relative;z-index:5;flex-shrink:0;}
.reply-bar.show{display:flex;}
.reply-bar .rb-left{width:4px;height:38px;border-radius:3px;background:linear-gradient(180deg,#a855f7,#6366f1);flex-shrink:0;}
.reply-bar .rb-content{flex:1;min-width:0;}
.reply-bar .rb-name{font-size:11.5px;font-weight:700;color:#d8b4fe;}
.reply-bar .rb-text{font-size:12.5px;color:rgba(255,255,255,.75);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;}
.reply-bar .rb-close{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.1);border:none;color:#d8b4fe;cursor:pointer;display:grid;place-items:center;font-size:14px;flex-shrink:0;}

.quote-box{margin-bottom:6px;padding:7px 10px;border-radius:10px;background:rgba(0,0,0,.22);border-left:3px solid #d8b4fe;cursor:pointer;}
.msg-bubble.outgoing .quote-box{background:rgba(255,255,255,.15);border-left-color:#fff;}
.quote-box .qn{font-size:10.5px;font-weight:700;color:#d8b4fe;margin-bottom:2px;}
.msg-bubble.outgoing .quote-box .qn{color:#f0e6ff;}
.quote-box .qt{font-size:12px;color:rgba(255,255,255,.85);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px;}

/* Recording bar */
.rec-bar{display:none;align-items:center;justify-content:center;gap:12px;padding:12px;background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.4);border-radius:20px;margin:6px 12px 0;font-size:13px;color:#fca5a5;font-weight:600;flex-shrink:0;}
.rec-bar.show{display:flex;}
.rec-bar .dot{width:10px;height:10px;border-radius:50%;background:#ef4444;animation:recPulse 1s ease-in-out infinite;}
@keyframes recPulse{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,.7);}50%{box-shadow:0 0 0 10px rgba(239,68,68,0);}}

/* Emoji picker */
.emoji-picker{position:absolute;bottom:78px;left:10px;right:10px;max-height:290px;overflow-y:auto;display:none;grid-template-columns:repeat(8,1fr);gap:4px;padding:12px;border-radius:20px;background:rgba(30,15,45,.98);backdrop-filter:blur(26px);border:1px solid rgba(168,85,247,.35);z-index:100;box-shadow:0 20px 50px rgba(0,0,0,.7);}
.emoji-picker.show{display:grid;}
.emoji-picker::-webkit-scrollbar{width:5px;}
.emoji-picker::-webkit-scrollbar-thumb{background:rgba(168,85,247,.4);border-radius:10px;}
.emoji-picker .ep-cat{grid-column:1/-1;font-size:11px;color:#d8b4fe;font-weight:700;padding:8px 4px 4px;text-transform:uppercase;letter-spacing:.5px;}
.emoji-picker .ei{aspect-ratio:1/1;display:grid;place-items:center;font-size:24px;cursor:pointer;border-radius:10px;transition:.15s;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;}
.emoji-picker .ei:hover{background:rgba(168,85,247,.25);transform:scale(1.15);}

/* Chat footer */
.chat-footer{display:flex;align-items:center;padding:11px 10px;gap:8px;background:rgba(20,10,32,.9);backdrop-filter:blur(20px);border-top:1px solid rgba(168,85,247,.2);position:relative;z-index:6;flex-shrink:0;}
.actions{display:flex;gap:6px;}
.act-btn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:rgba(168,85,247,.12);border:1px solid rgba(168,85,247,.25);color:#d8b4fe;font-size:15px;cursor:pointer;transition:.25s;}
.act-btn:hover{background:linear-gradient(135deg,#a855f7,#6366f1);color:#fff;}
.act-btn.recording{background:linear-gradient(135deg,#ef4444,#b91c1c);color:#fff;animation:recPulse 1s ease-in-out infinite;}
.input-box{flex:1;display:flex;align-items:center;background:rgba(168,85,247,.1);border:1px solid rgba(168,85,247,.25);border-radius:22px;padding:9px 12px;gap:6px;min-width:0;}
.input-box input{flex:1;border:none;background:transparent;outline:none;font-size:14.5px;color:#fff;min-width:0;font-family:inherit;}
.input-box input::placeholder{color:rgba(200,215,235,.5);}
.input-box.disabled{opacity:.5;}
.emoji-trigger{color:#d8b4fe;font-size:19px;cursor:pointer;}
.send-btn{width:44px;height:44px;border-radius:50%;border:none;background:linear-gradient(135deg,#a855f7,#6366f1);color:#fff;font-size:16px;cursor:pointer;display:grid;place-items:center;flex-shrink:0;box-shadow:0 10px 26px rgba(168,85,247,.6);}
.send-btn:disabled{opacity:.4;cursor:not-allowed;}

/* Add Friend CTA (non-friend) */
.add-friend-cta{padding:16px 14px;background:rgba(168,85,247,.08);border-top:1px solid rgba(168,85,247,.25);flex-shrink:0;text-align:center;}
.add-friend-cta .af-msg{font-size:12.5px;color:rgba(200,215,235,.8);margin-bottom:12px;line-height:1.5;}
.add-friend-cta .af-buttons{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;}
.add-friend-cta button{padding:12px 22px;border:none;border-radius:14px;font-size:13.5px;font-weight:700;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:8px;transition:.2s;}
.add-friend-cta .af-add{background:linear-gradient(135deg,#a855f7,#6366f1);color:#fff;box-shadow:0 6px 18px rgba(168,85,247,.5);}
.add-friend-cta .af-add.sent{background:rgba(34,197,94,.2);color:#86efac;border:1px solid rgba(34,197,94,.4);box-shadow:none;cursor:default;}
.add-friend-cta .af-add:disabled{cursor:default;}

/* Message action sheet */
.sheet-overlay{position:fixed;inset:0;z-index:2000;display:none;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.65);backdrop-filter:blur(4px);}
.sheet-overlay.show{display:flex;}
.sheet{width:100%;max-width:480px;background:rgba(30,15,45,.98);border-top-left-radius:24px;border-top-right-radius:24px;padding:16px 14px 24px;border:1px solid rgba(168,85,247,.3);border-bottom:none;animation:sheetUp .3s cubic-bezier(.2,.8,.2,1.2) both;padding-bottom:calc(24px + env(safe-area-inset-bottom));}
@keyframes sheetUp{from{transform:translateY(100%);}to{transform:translateY(0);}}
.sheet-handle{width:44px;height:4px;border-radius:3px;background:rgba(168,85,247,.5);margin:0 auto 14px;}
.sheet-btn{width:100%;padding:14px 16px;background:rgba(168,85,247,.12);border:1px solid rgba(168,85,247,.25);color:#fff;font-size:14px;font-weight:600;border-radius:14px;cursor:pointer;display:flex;align-items:center;gap:12px;font-family:inherit;margin-bottom:8px;transition:.2s;text-align:left;}
.sheet-btn:hover{background:rgba(168,85,247,.25);}
.sheet-btn i{width:22px;color:#d8b4fe;font-size:16px;}
.sheet-btn.danger{background:rgba(239,68,68,.15);border-color:rgba(239,68,68,.4);color:#fca5a5;}
.sheet-btn.danger i{color:#fca5a5;}
.sheet-btn.cancel{background:rgba(255,255,255,.06);justify-content:center;color:rgba(255,255,255,.7);border-color:rgba(255,255,255,.1);}

/* Toast */
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%) translateY(30px);padding:11px 22px;border-radius:16px;background:rgba(168,85,247,.95);color:#fff;font-size:13.5px;font-weight:600;z-index:5000;box-shadow:0 14px 32px rgba(168,85,247,.6);opacity:0;transition:.3s;pointer-events:none;max-width:90%;text-align:center;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* Call overlay */
.call-overlay{position:fixed;inset:0;z-index:2000;display:none;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 0%,#3a1454 0%,#0a0616 70%);}
.call-overlay.show{display:flex;}
.call-card{width:min(90vw,340px);padding:34px 24px 28px;border-radius:32px;background:linear-gradient(160deg,rgba(168,85,247,.2),rgba(99,102,241,.1));border:1px solid rgba(168,85,247,.35);backdrop-filter:blur(30px);box-shadow:0 40px 90px rgba(168,85,247,.5);text-align:center;}
.call-card .cav{width:110px;height:110px;margin:0 auto 18px;border-radius:50%;position:relative;}
.call-card .cav img{width:100%;height:100%;border-radius:50%;object-fit:cover;border:3px solid rgba(245,215,110,.5);box-shadow:0 0 0 8px rgba(168,85,247,.2);}
.call-card .cav::before{content:'';position:absolute;inset:-10px;border-radius:50%;border:2px solid rgba(168,85,247,.7);animation:ringPulse 1.5s ease-out infinite;}
@keyframes ringPulse{0%{transform:scale(.9);opacity:1;}100%{transform:scale(1.3);opacity:0;}}
.call-card h3{font-size:22px;font-weight:700;color:#fff;margin-bottom:6px;}
.call-card p{font-size:14px;color:rgba(255,255,255,.7);margin-bottom:26px;}
.call-card .call-emoji{font-size:30px;display:inline-block;margin-bottom:12px;}
.call-actions{display:flex;justify-content:center;gap:22px;}
.call-btn{width:64px;height:64px;border-radius:50%;border:none;color:#fff;font-size:24px;cursor:pointer;display:grid;place-items:center;transition:.22s;box-shadow:0 12px 28px rgba(0,0,0,.5);}
.call-btn.reject{background:linear-gradient(135deg,#ef4444,#dc2626);}
.call-btn.accept{background:linear-gradient(135deg,#22c55e,#16a34a);}
</style>
</head>
<body>

<div class="bg-orbs"><span></span><span></span><span></span></div>

<!-- LOGIN OVERLAY -->
<div class="login-overlay" id="loginOverlay">
    <div class="login-card">
        <div class="login-icon">💬</div>
        <h1>MOI Chat</h1>
        <p>বন্ধুদের সাথে কথা বলতে এবং নতুন বন্ধু তৈরি করতে Google দিয়ে সাইন ইন করুন।</p>
        <button class="login-btn" onclick="goToLogin()"><i class="fa-brands fa-google"></i>Sign in with Google</button>
    </div>
</div>

<!-- MAIN SCREEN -->
<div class="screen" id="mainScreen">
    <div class="header">
        <div class="my-profile">
            <div class="my-av"><img id="myAvatar" src="" alt="Me"></div>
            <div class="my-info">
                <div class="mname" id="myName">—</div>
                <div class="muid" id="myUid">—</div>
            </div>
        </div>
        <div class="hdr-actions">
            <div class="icon-btn" onclick="copyMyUid()" title="UID কপি"><i class="fa-solid fa-copy"></i></div>
        </div>
    </div>

    <div class="tabs">
        <div class="tab active" data-tab="friends" onclick="switchTab('friends')">বন্ধু</div>
        <div class="tab" data-tab="requests" onclick="switchTab('requests')">Requests<span class="tab-badge" id="reqBadge">0</span></div>
    </div>

    <div class="search-wrap" id="searchWrap">
        <input type="text" id="searchInput" placeholder="🔍 বন্ধু খুঁজুন...">
    </div>

    <div class="list-area" id="listArea">
        <div class="empty"><div class="big">💬</div>লোড হচ্ছে...</div>
    </div>
</div>

<!-- CHAT SCREEN -->
<div class="chat-screen" id="chatScreen">
    <div class="chat-header">
        <div class="back-btn" onclick="backToList()"><i class="fa-solid fa-arrow-left"></i></div>
        <div class="av-wrap" id="chatAvWrap"><img id="chatAvatar" src="" alt=""></div>
        <div class="chat-info">
            <div class="cn" id="chatName">—</div>
            <div class="cs" id="chatStatus">—</div>
        </div>
        <div class="hdr-btns" id="chatHeaderBtns">
            <div class="icon-btn" onclick="startCall()" title="অডিও কল" id="callBtn"><i class="fa-solid fa-phone"></i></div>
        </div>
    </div>

    <div class="chat-body" id="chatBody"></div>

    <div class="rec-bar" id="recBar">
        <span class="dot"></span><span>রেকর্ডিং...</span><span id="recTime">00:00</span>
        <button onclick="stopRecording()" style="background:#ef4444;border:none;color:#fff;padding:6px 14px;border-radius:10px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;margin-left:8px;">পাঠান</button>
        <button onclick="cancelRecording()" style="background:rgba(255,255,255,.1);border:none;color:#fff;padding:6px 14px;border-radius:10px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;">বাতিল</button>
    </div>

    <div class="reply-bar" id="replyBar">
        <div class="rb-left"></div>
        <div class="rb-content">
            <div class="rb-name" id="replyName">—</div>
            <div class="rb-text" id="replyText">—</div>
        </div>
        <button class="rb-close" onclick="cancelReply()"><i class="fa-solid fa-xmark"></i></button>
    </div>

    <div class="emoji-picker" id="emojiPicker"></div>

    <div class="chat-footer" id="chatFooter">
        <div class="actions">
            <label for="imageInput" class="act-btn"><i class="fa-regular fa-image"></i></label>
            <input type="file" id="imageInput" accept="image/*" style="display:none" onchange="sendFile(event,'image')">
            <label for="videoInput" class="act-btn"><i class="fa-solid fa-video"></i></label>
            <input type="file" id="videoInput" accept="video/*" style="display:none" onchange="sendFile(event,'video')">
            <button class="act-btn" id="micBtn" onclick="toggleRecording()"><i class="fa-solid fa-microphone"></i></button>
        </div>
        <div class="input-box">
            <input type="text" id="messageInput" placeholder="Aa" onkeypress="if(event.key==='Enter')sendText()">
            <i class="fa-regular fa-face-smile emoji-trigger" onclick="toggleEmojiPicker(event)"></i>
        </div>
        <button class="send-btn" onclick="sendText()"><i class="fa-solid fa-paper-plane"></i></button>
    </div>

    <!-- Add Friend CTA (shown only when not friends) -->
    <div class="add-friend-cta" id="addFriendCta" style="display:none;">
        <div class="af-msg">💬 কথা বলতে এই ইউজারকে আগে বন্ধু হতে হবে।</div>
        <div class="af-buttons">
            <button class="af-add" id="afAddBtn" onclick="sendFriendRequest()"><i class="fa-solid fa-user-plus"></i> Add Friend</button>
        </div>
    </div>
</div>

<!-- Message action sheet -->
<div class="sheet-overlay" id="msgSheet" onclick="if(event.target===this)closeMsgSheet()">
    <div class="sheet">
        <div class="sheet-handle"></div>
        <div id="msgSheetBody"></div>
        <button class="sheet-btn cancel" onclick="closeMsgSheet()">বাতিল</button>
    </div>
</div>

<!-- Call overlay -->
<div class="call-overlay" id="callOverlay">
    <div class="call-card">
        <div class="call-emoji">📞</div>
        <div class="cav"><img id="callAvatar" src=""></div>
        <h3 id="callName">—</h3>
        <p id="callStatusText">সংযোগ করা হচ্ছে...</p>
        <div class="call-actions">
            <button class="call-btn reject" onclick="hangupCall()"><i class="fa-solid fa-phone-slash"></i></button>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import { getDatabase, ref, onValue, set, update, remove, get, onDisconnect, push, query, limitToLast, runTransaction, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

/* ========== FIREBASE ========== */
const firebaseConfig = {
    apiKey: "AIzaSyCTn3QEYtRMxm7Y91RSFSvbRJSRHcXMEdI",
    authDomain: "room-7fbf7.firebaseapp.com",
    databaseURL: "https://room-7fbf7-default-rtdb.firebaseio.com",
    projectId: "room-7fbf7",
    storageBucket: "room-7fbf7.firebasestorage.app",
    messagingSenderId: "417946695868",
    appId: "1:417946695868:web:34c6f63269aaf659b2b8b9"
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const auth = getAuth(app);
const provider = new GoogleAuthProvider();

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DEFAULT_AV = 'data:image/svg+xml;utf8,' + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="50" fill="#3b2a4f"/><circle cx="50" cy="40" r="18" fill="#7a6a8f"/><ellipse cx="50" cy="88" rx="30" ry="22" fill="#7a6a8f"/></svg>`);

/* ========== STATE ========== */
let me = null;                 // {uid, name, photo, moiId}
let allUsers = {};
let presence = {};
let myFriends = {};            // {friendUid: true}
let myRequests = {};           // {fromUid: {...}}
let mySentRequests = {};       // {toUid: true}
let myBlocked = {};            // {uid: true}
let blockedByOthers = {};      // {uid: true} — যারা আমাকে block করেছে
let chatMetas = {};            // {otherUid: {...}}
let chatRef = null;
let currentChatUid = null;
let currentChatUser = null;
let chatListeners = [];
let replyTarget = null;
let lastSeenMsgTs = 0;

/* ========== URL PARAMS ========== */
const params = new URLSearchParams(location.search);
const TARGET_UID = params.get('targetUid') || '';
const TARGET_NAME = params.get('targetName') || '';
const TARGET_AVATAR = params.get('targetAvatar') || '';
const IS_EMBEDDED = window.self !== window.top;

/* ========== LOGIN ========== */
window.goToLogin = async () => {
    try {
        await signInWithPopup(auth, provider);
    } catch (e) {
        toast('লগইন ব্যর্থ: ' + (e.code || e.message));
    }
};

onAuthStateChanged(auth, async user => {
    if (!user) {
        $('loginOverlay').classList.add('show');
        return;
    }
    $('loginOverlay').classList.remove('show');

    // Load full profile
    let profile = {
        uid: user.uid,
        name: user.displayName || (user.email ? user.email.split('@')[0] : 'User'),
        photo: user.photoURL || DEFAULT_AV,
        moiId: ''
    };
    try {
        const snap = await get(ref(db, 'users/' + user.uid));
        if (snap.exists()) {
            const u = snap.val();
            profile.name = u.name || profile.name;
            profile.photo = u.photo || u.avatar || profile.photo;
            profile.moiId = u.moiId || '';
        }
    } catch(e){}

    me = profile;
    initUI();
});

/* ========== INIT ========== */
function initUI() {
    $('myAvatar').src = me.photo || DEFAULT_AV;
    $('myName').textContent = me.name;
    $('myUid').textContent = '🆔 ' + (me.moiId || me.uid.slice(0,8));

    // Register presence
    const myPresRef = ref(db, 'presence/' + me.uid);
    set(myPresRef, { name: me.name, uid: me.uid, time: Date.now() });
    onDisconnect(myPresRef).remove();

    // Ensure user node has latest name/photo
    update(ref(db, 'users/' + me.uid), { name: me.name, photo: me.photo, uid: me.uid });

    attachListeners();
    renderEmojiPicker();
    $('mainScreen').classList.add('show');

    // If direct target specified → open chat
    if (TARGET_UID && TARGET_UID !== me.uid) {
        setTimeout(() => openChatWith(TARGET_UID), 400);
    }
}

/* ========== LISTENERS ========== */
function attachListeners() {
    onValue(ref(db, 'users'), s => { allUsers = s.val() || {}; renderList(); updateChatHeader(); });
    onValue(ref(db, 'presence'), s => { presence = s.val() || {}; renderList(); updateChatHeader(); });
    onValue(ref(db, 'users/' + me.uid + '/friends'), s => { myFriends = s.val() || {}; renderList(); });
    onValue(ref(db, 'friendRequests/' + me.uid), s => { myRequests = s.val() || {}; renderList(); updateReqBadge(); });
    onValue(ref(db, 'sentRequests/' + me.uid), s => { mySentRequests = s.val() || {}; renderList(); updateFriendStatus(); });
    onValue(ref(db, 'blocked/' + me.uid), s => { myBlocked = s.val() || {}; renderList(); });
    onValue(ref(db, 'userChatMeta/' + me.uid), s => { chatMetas = s.val() || {}; renderList(); updateUnreadBadge(); });
}

/* ========== TABS ========== */
let activeTab = 'friends';
window.switchTab = (t) => {
    activeTab = t;
    document.querySelectorAll('.tab').forEach(x => x.classList.toggle('active', x.dataset.tab === t));
    $('searchWrap').style.display = (t === 'friends') ? '' : 'none';
    renderList();
};
function updateReqBadge() {
    const n = Object.keys(myRequests).length;
    const b = $('reqBadge');
    b.textContent = n;
    b.classList.toggle('show', n > 0);
}

/* ========== RENDER LIST ========== */
function renderList() {
    const area = $('listArea');
    if (!me) return;

    if (activeTab === 'requests') {
        const list = Object.values(myRequests);
        if (!list.length) {
            area.innerHTML = '<div class="empty"><div class="big">📩</div>এখনো কোনো বন্ধুর অনুরোধ নেই</div>';
            return;
        }
        area.innerHTML = list.map(r => `
            <div class="req-card">
                <img src="${esc(r.fromPhoto || DEFAULT_AV)}">
                <div class="req-info">
                    <div class="rn">${esc(r.fromName || 'User')}</div>
                    <div class="rt">আপনাকে বন্ধু হতে চায়</div>
                </div>
                <div class="req-actions">
                    <button class="acc" onclick="acceptRequest('${esc(r.fromUid)}')">✓ Accept</button>
                    <button class="blk" onclick="blockRequest('${esc(r.fromUid)}')">Block</button>
                </div>
            </div>`).join('');
        return;
    }

    // Friends tab
    const search = ($('searchInput').value || '').trim().toLowerCase();
    const friendUids = Object.keys(myFriends).filter(uid => !myBlocked[uid]);

    // Build friend list entries
    const friends = friendUids.map(uid => {
        const u = allUsers[uid] || {};
        const meta = chatMetas[uid] || {};
        const online = !!presence[uid];
        return {
            uid,
            name: u.name || 'User',
            photo: u.photo || u.avatar || DEFAULT_AV,
            online,
            lastSeen: u.lastSeen || 0,
            lastMsg: meta.lastMessage || '',
            lastType: meta.lastType || 'text',
            lastSender: meta.lastSender || '',
            lastTime: meta.lastTime || 0,
            unread: meta.unread || 0
        };
    }).filter(f => !search || f.name.toLowerCase().includes(search));

    friends.sort((a,b) => {
        if (a.unread !== b.unread) return b.unread - a.unread;
        if (a.online !== b.online) return a.online ? -1 : 1;
        if (b.lastTime !== a.lastTime) return b.lastTime - a.lastTime;
        return a.name.localeCompare(b.name);
    });

    if (!friends.length) {
        if (search) {
            area.innerHTML = '<div class="empty"><div class="big">🔍</div>কোনো বন্ধু পাওয়া যায়নি</div>';
        } else {
            area.innerHTML = '<div class="empty"><div class="big">👥</div>এখনো কোনো বন্ধু নেই<br><br>রুমে কারো Profile-এ গিয়ে<br>Add Friend দিন</div>';
        }
        return;
    }

    const onlineL = friends.filter(f => f.online);
    const offlineL = friends.filter(f => !f.online);

    let html = '';
    if (onlineL.length) {
        html += '<div class="section-title">🟢 অনলাইন (' + onlineL.length + ')</div>';
        onlineL.forEach(f => html += friendRowHTML(f));
    }
    if (offlineL.length) {
        html += '<div class="section-title" style="margin-top:6px">⚪ অফলাইন (' + offlineL.length + ')</div>';
        offlineL.forEach(f => html += friendRowHTML(f));
    }
    area.innerHTML = html;
}

function friendRowHTML(f) {
    let preview;
    if (f.lastType === 'image') preview = '📷 ছবি';
    else if (f.lastType === 'video') preview = '🎬 ভিডিও';
    else if (f.lastType === 'audio') preview = '🎤 ভয়েস';
    else preview = f.lastMsg || '';

    const senderTag = f.lastSender === me.uid ? '<span class="lbl-sender">আপনি: </span>' : '';
    const statusLine = f.online
        ? '<span class="lbl-online">● Online</span>'
        : '<span class="lbl-offline">' + (f.lastSeen ? timeAgo(f.lastSeen) : 'অফলাইন') + '</span>';

    const previewHtml = preview
        ? `${statusLine} · ${senderTag}${esc(preview)}`
        : statusLine;

    const timeStr = f.lastTime ? timeAgo(f.lastTime) : '';
    const unreadHtml = f.unread > 0
        ? `<div class="u-unread">${f.unread > 99 ? '99+' : f.unread}</div>`
        : '';

    return `<div class="user-item" onclick="openChatWith('${esc(f.uid)}')">
        <div class="u-avatar">
            <img src="${esc(f.photo)}" onerror="this.src='${DEFAULT_AV}'">
            <div class="status-dot ${f.online ? 'online' : ''}"></div>
        </div>
        <div class="u-info">
            <div class="u-name">${esc(f.name)}</div>
            <div class="u-last">${previewHtml}</div>
        </div>
        <div class="u-meta">
            <div class="u-time">${esc(timeStr)}</div>
            ${unreadHtml}
        </div>
    </div>`;
}

/* ========== FRIEND REQUEST ========== */
window.sendFriendRequest = async () => {
    if (!me || !currentChatUid) return;
    if (myFriends[currentChatUid]) return;
    if (mySentRequests[currentChatUid]) { toast('✅ ইতিমধ্যে অনুরোধ পাঠানো হয়েছে'); return; }
    try {
        await set(ref(db, 'friendRequests/' + currentChatUid + '/' + me.uid), {
            fromUid: me.uid,
            fromName: me.name,
            fromPhoto: me.photo,
            ts: Date.now()
        });
        await set(ref(db, 'sentRequests/' + me.uid + '/' + currentChatUid), true);
        toast('✅ বন্ধুর অনুরোধ পাঠানো হয়েছে');
        updateFriendStatus();
    } catch (e) {
        toast('❌ পাঠানো যায়নি: ' + e.message);
    }
};

window.acceptRequest = async (fromUid) => {
    if (!me || !fromUid) return;
    try {
        // mutual friendship
        await set(ref(db, 'users/' + me.uid + '/friends/' + fromUid), true);
        await set(ref(db, 'users/' + fromUid + '/friends/' + me.uid), true);
        // cleanup
        await remove(ref(db, 'friendRequests/' + me.uid + '/' + fromUid));
        await remove(ref(db, 'sentRequests/' + fromUid + '/' + me.uid));
        toast('🎉 আপনি এখন বন্ধু');
        renderList();
        updateReqBadge();
    } catch (e) {
        toast('❌ ' + e.message);
    }
};

window.blockRequest = async (fromUid) => {
    if (!fromUid) return;
    try {
        await set(ref(db, 'blocked/' + me.uid + '/' + fromUid), Date.now());
        await remove(ref(db, 'friendRequests/' + me.uid + '/' + fromUid));
        await remove(ref(db, 'sentRequests/' + fromUid + '/' + me.uid));
        toast('🚫 ব্লক করা হয়েছে');
        renderList();
        updateReqBadge();
    } catch (e) {
        toast('❌ ' + e.message);
    }
};

/* ========== OPEN CHAT ========== */
window.openChatWith = async (uid) => {
    if (!me || !uid || uid === me.uid) return;
    detachChatListeners();

    currentChatUid = uid;
    // Load user profile
    const u = allUsers[uid] || {};
    currentChatUser = {
        uid,
        name: u.name || TARGET_NAME || 'User',
        photo: u.photo || u.avatar || DEFAULT_AV
    };

    $('mainScreen').classList.remove('show');
    $('chatScreen').classList.add('show');
    $('chatName').textContent = currentChatUser.name;
    $('chatAvatar').src = currentChatUser.photo;
    $('chatBody').innerHTML = '';
    $('messageInput').value = '';
    cancelReply();

    // Mark unread = 0
    try { await set(ref(db, 'userChatMeta/' + me.uid + '/' + uid + '/unread'), 0); } catch(e){}

    updateChatHeader();

    // Check friendship
    const isFriend = !!myFriends[uid];
    updateFriendStatus();

    // Set up chat listener
    const chatId = roomId(me.uid, uid);
    chatRef = ref(db, 'chats/' + chatId + '/messages');

    const addedCb = snap => {
        const data = snap.val();
        if (!data) return;
        if (data.deletedFor && Array.isArray(data.deletedFor) && data.deletedFor.includes(me.uid)) return;
        renderMessage(data, snap.key);
        if (data.senderUid && data.senderUid !== me.uid) {
            update(ref(db, 'chats/' + chatId + '/messages/' + snap.key + '/deliveredTo/' + me.uid), true);
            if (document.visibilityState === 'visible') {
                setTimeout(() => update(ref(db, 'chats/' + chatId + '/messages/' + snap.key + '/readBy/' + me.uid), true), 500);
            }
        }
    };
    const changedCb = snap => {
        const data = snap.val();
        if (!data) return;
        const el = $('chatBody').querySelector('[data-key="' + snap.key + '"]');
        if (!el) return;
        if (data.deletedFor && Array.isArray(data.deletedFor) && data.deletedFor.includes(me.uid)) {
            el.style.transition = 'all .3s'; el.style.opacity = '0';
            setTimeout(() => el.remove(), 300);
            return;
        }
        if (el.dataset.isMe === '1') {
            const timeDiv = el.querySelector('.msg-time');
            if (timeDiv) {
                let tickHtml = '<i class="fa-solid fa-check tick tick-sent"></i>';
                if (data.readBy && Object.keys(data.readBy).length > 0 && !data.readBy[me.uid]) {
                    tickHtml = '<i class="fa-solid fa-circle-check tick tick-seen"></i>';
                } else if (data.deliveredTo && Object.keys(data.deliveredTo).length > 0) {
                    tickHtml = '<i class="fa-solid fa-check-double tick tick-delivered"></i>';
                }
                const existing = timeDiv.querySelector('.tick');
                if (existing) existing.outerHTML = tickHtml;
                else timeDiv.insertAdjacentHTML('beforeend', tickHtml);
            }
        }
    };
    const removedCb = snap => {
        const el = $('chatBody').querySelector('[data-key="' + snap.key + '"]');
        if (el) { el.style.transition='all .3s'; el.style.opacity='0'; setTimeout(()=>el.remove(),300); }
    };

    chatRef.on('child_added', addedCb);
    chatRef.on('child_changed', changedCb);
    chatRef.on('child_removed', removedCb);
    chatListeners.push([chatRef, 'child_added', addedCb]);
    chatListeners.push([chatRef, 'child_changed', changedCb]);
    chatListeners.push([chatRef, 'child_removed', removedCb]);

    setTimeout(() => $('messageInput').focus(), 250);
};

function detachChatListeners() {
    chatListeners.forEach(([r, ev, cb]) => { try { r.off(ev, cb); } catch(e){} });
    chatListeners = [];
}

/* ========== RENDER MESSAGE ========== */
function renderMessage(data, key) {
    const isMe = data.senderUid === me.uid;
    const wrap = document.createElement('div');
    wrap.className = 'msg-wrap ' + (isMe ? 'outgoing' : 'incoming');
    wrap.dataset.key = key;
    wrap.dataset.isMe = isMe ? '1' : '0';

    let tick = '';
    if (isMe) {
        if (data.readBy && Object.keys(data.readBy).length > 0 && !data.readBy[me.uid]) {
            tick = '<i class="fa-solid fa-circle-check tick tick-seen"></i>';
        } else if (data.deliveredTo && Object.keys(data.deliveredTo).length > 0) {
            tick = '<i class="fa-solid fa-check-double tick tick-delivered"></i>';
        } else {
            tick = '<i class="fa-solid fa-check tick tick-sent"></i>';
        }
    }

    let quote = '';
    if (data.replyTo) {
        const r = data.replyTo;
        quote = `<div class="quote-box" data-qkey="${esc(r.key||'')}">
            <div class="qn">${esc(r.senderName||'')}</div>
            <div class="qt">${esc(r.preview||'')}</div>
        </div>`;
    }

    let inner = '';
    if (data.type === 'text') {
        inner = `<div class="msg-bubble ${isMe?'outgoing':'incoming'}">${quote}${esc(data.content)}<div class="msg-time">${esc(data.time||'')}${tick}</div></div>`;
    } else if (data.type === 'image') {
        inner = `<div class="msg-bubble ${isMe?'outgoing':'incoming'}">${quote}<img src="${data.content}"><div class="msg-time">${esc(data.time||'')}${tick}</div></div>`;
    } else if (data.type === 'video') {
        inner = `<div class="msg-bubble ${isMe?'outgoing':'incoming'}">${quote}<video src="${data.content}" controls></video><div class="msg-time">${esc(data.time||'')}${tick}</div></div>`;
    } else if (data.type === 'audio') {
        const dur = data.duration || 0;
        inner = `<div class="msg-bubble ${isMe?'outgoing':'incoming'}">${quote}
            <div class="voice-player">
                <button class="vp-play"><i class="fa-solid fa-play"></i></button>
                <div class="vp-bar"><div class="vp-bar-inner"></div></div>
                <span class="vp-time">${fmtTime(dur)}</span>
                <audio preload="metadata" src="${data.content}"></audio>
            </div>
            <div class="msg-time">${esc(data.time||'')}${tick}</div></div>`;
    } else if (data.type === 'emoji') {
        inner = `<div class="msg-bubble emoji-msg ${isMe?'outgoing':'incoming'}">${quote}<span class="e">${data.emoji || '😊'}</span><div class="msg-time" style="justify-content:center;opacity:.5;">${esc(data.time||'')}${tick}</div></div>`;
    }
    wrap.innerHTML = inner;

    if (data.type === 'audio') setupVoicePlayer(wrap);

    const qb = wrap.querySelector('.quote-box');
    if (qb) {
        qb.addEventListener('click', e => {
            e.stopPropagation();
            const target = $('chatBody').querySelector('[data-key="' + qb.dataset.qkey + '"]');
            if (target) {
                target.scrollIntoView({ behavior:'smooth', block:'center' });
                const old = target.style.background;
                target.style.background = 'rgba(168,85,247,.35)';
                target.style.borderRadius = '14px';
                setTimeout(()=>{ target.style.background = old; }, 1200);
            }
        });
    }

    // Long-press / right-click for action sheet
    let pressTimer = null;
    const openSheet = () => openMsgActionSheet(key, data, isMe);
    const clearP = () => { if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; } };
    wrap.addEventListener('touchstart', () => { pressTimer = setTimeout(openSheet, 550); }, { passive: true });
    wrap.addEventListener('touchend', clearP);
    wrap.addEventListener('touchmove', clearP);
    wrap.addEventListener('touchcancel', clearP);
    wrap.addEventListener('mousedown', e => { if (e.button === 0) pressTimer = setTimeout(openSheet, 550); });
    wrap.addEventListener('mouseup', clearP);
    wrap.addEventListener('mouseleave', clearP);
    wrap.addEventListener('contextmenu', e => { e.preventDefault(); openSheet(); });

    // Swipe to reply
    attachSwipeReply(wrap, data, key);

    $('chatBody').appendChild(wrap);
    $('chatBody').scrollTop = $('chatBody').scrollHeight;
}

function attachSwipeReply(el, data, key) {
    let sx = 0, sy = 0, sw = false;
    el.addEventListener('touchstart', e => {
        const t = e.touches[0];
        sx = t.clientX; sy = t.clientY; sw = true;
    }, { passive: true });
    el.addEventListener('touchmove', e => {
        if (!sw) return;
        const t = e.touches[0];
        const dx = t.clientX - sx, dy = t.clientY - sy;
        if (Math.abs(dy) > 30) { sw = false; return; }
        if (dx > 20 && Math.abs(dx) > Math.abs(dy)) {
            el.style.transform = 'translateX(' + Math.min(dx, 60) + 'px) scale(.98)';
        }
    }, { passive: true });
    el.addEventListener('touchend', e => {
        if (!sw) { el.style.transform = ''; return; }
        const t = e.changedTouches[0];
        if (t.clientX - sx > 55) { setReply(data, key); if (navigator.vibrate) navigator.vibrate(20); }
        el.style.transform = '';
        sw = false;
    });
    let mx = 0, md = false;
    el.addEventListener('mousedown', e => { if (e.button !== 0) return; mx = e.clientX; md = true; });
    el.addEventListener('mousemove', e => { if (!md) return; const dx = e.clientX - mx; if (dx > 20) el.style.transform = 'translateX(' + Math.min(dx, 60) + 'px) scale(.98)'; });
    el.addEventListener('mouseup', e => { if (!md) return; if (e.clientX - mx > 55) setReply(data, key); el.style.transform=''; md=false; });
    el.addEventListener('mouseleave', () => { el.style.transform = ''; md = false; });
}

function setReply(data, key) {
    let preview = '';
    if (data.type === 'text') preview = data.content || '';
    else if (data.type === 'image') preview = '📷 ছবি';
    else if (data.type === 'video') preview = '🎬 ভিডিও';
    else if (data.type === 'audio') preview = '🎤 ভয়েস';
    else if (data.type === 'emoji') preview = data.emoji || '😊';
    replyTarget = { key, senderName: data.senderUid === me.uid ? 'আপনি' : (data.senderName || ''), preview };
    $('replyName').textContent = '↩ ' + replyTarget.senderName;
    $('replyText').textContent = preview;
    $('replyBar').classList.add('show');
    $('messageInput').focus();
}
window.cancelReply = () => {
    replyTarget = null;
    $('replyBar').classList.remove('show');
};

/* ========== VOICE PLAYER ========== */
function setupVoicePlayer(wrap) {
    const btn = wrap.querySelector('.vp-play');
    const audio = wrap.querySelector('audio');
    const bar = wrap.querySelector('.vp-bar');
    const barI = wrap.querySelector('.vp-bar-inner');
    const time = wrap.querySelector('.vp-time');
    const icon = btn.querySelector('i');
    if (!audio) return;
    audio.addEventListener('loadedmetadata', () => { if (audio.duration && isFinite(audio.duration)) time.textContent = fmtTime(audio.duration); });
    audio.addEventListener('timeupdate', () => {
        if (audio.duration && isFinite(audio.duration) && audio.duration > 0) {
            barI.style.width = (audio.currentTime / audio.duration * 100) + '%';
            time.textContent = fmtTime(audio.currentTime);
        }
    });
    audio.addEventListener('ended', () => { icon.className = 'fa-solid fa-play'; barI.style.width = '0%'; if (audio.duration && isFinite(audio.duration)) time.textContent = fmtTime(audio.duration); });
    btn.addEventListener('click', e => {
        e.stopPropagation();
        document.querySelectorAll('.voice-player audio').forEach(a => {
            if (a !== audio && !a.paused) { a.pause(); a.currentTime = 0; const p = a.closest('.voice-player'); if (p) { p.querySelector('.vp-play i').className = 'fa-solid fa-play'; p.querySelector('.vp-bar-inner').style.width = '0%'; } }
        });
        if (audio.paused) { audio.play().then(() => { icon.className = 'fa-solid fa-pause'; }).catch(() => toast('ভয়েস চালানো যায়নি')); }
        else { audio.pause(); icon.className = 'fa-solid fa-play'; }
    });
    bar.addEventListener('click', e => {
        e.stopPropagation();
        if (!audio.duration || !isFinite(audio.duration)) return;
        const r = bar.getBoundingClientRect();
        audio.currentTime = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)) * audio.duration;
    });
}

function pushMsg(payload) {
    if (!chatRef || !currentChatUid) return;
    payload.senderUid = me.uid;
    payload.senderName = me.name;
    payload.time = nowTime();
    payload.ts = Date.now();
    payload.deliveredTo = { [me.uid]: true };
    if (replyTarget) payload.replyTo = replyTarget;

    const chatId = roomId(me.uid, currentChatUid);
    push(ref(db, 'chats/' + chatId + '/messages'), payload);

    let lastMessage = '';
    if (payload.type === 'text') lastMessage = payload.content;
    else if (payload.type === 'image') lastMessage = '📷 ছবি';
    else if (payload.type === 'video') lastMessage = '🎬 ভিডিও';
    else if (payload.type === 'audio') lastMessage = '🎤 ভয়েস';
    else if (payload.type === 'emoji') lastMessage = '😊 ইমোজি';

    const time = Date.now();
    update(ref(db, 'userChatMeta/' + me.uid + '/' + currentChatUid), {
        lastMessage, lastTime: time, lastSender: me.uid, lastType: payload.type
    });
    update(ref(db, 'userChatMeta/' + currentChatUid + '/' + me.uid), {
        lastMessage, lastTime: time, lastSender: me.uid, lastType: payload.type
    });
    runTransaction(ref(db, 'userChatMeta/' + currentChatUid + '/' + me.uid + '/unread'), n => (n || 0) + 1);

    cancelReply();
}

window.sendFile = (e, type) => {

    r.onload = ev => pushMsg({ type, content: ev.target.result });

    e.target.value = '';
};

/* ========== RECORDING ========== */
let mediaRecorder = null, audioChunks = [], isRec = false, recTimer = null, recStart = 0, recTimeout = null;
window.toggleRecording = async () => { if (isRec) { stopRecording(); } else { await startRecording(); } };
async function startRecording() {
    try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        audioChunks = [];
        let mime = '';
        if (MediaRecorder.isTypeSupported('audio/webm;codecs=opus')) mime = 'audio/webm;codecs=opus';
        else if (MediaRecorder.isTypeSupported('audio/webm')) mime = 'audio/webm';
        else if (MediaRecorder.isTypeSupported('audio/mp4')) mime = 'audio/mp4';
        mediaRecorder = mime ? new MediaRecorder(stream, { mimeType: mime }) : new MediaRecorder(stream);
        mediaRecorder.ondataavailable = e => { if (e.data && e.data.size) audioChunks.push(e.data); };
        mediaRecorder.onstop = () => {
            stream.getTracks().forEach(t => t.stop());
            const blob = new Blob(audioChunks, { type: mime || 'audio/webm' });
            const dur = Math.round((Date.now() - recStart) / 1000);
            if (blob.size < 800 || dur < 1) { resetRec(); return; }
            const rd = new FileReader();
            rd.onload = () => { pushMsg({ type: 'audio', content: rd.result, duration: dur, mime }); toast('🎤 ভয়েস পাঠানো ('+dur+'s)'); };
            rd.readAsDataURL(blob);
            resetRec();
        };
        mediaRecorder.start();
        isRec = true;
        recStart = Date.now();
        $('micBtn').classList.add('recording');
        $('recBar').classList.add('show');
        $('recTime').textContent = '00:00';
        recTimer = setInterval(() => { $('recTime').textContent = fmtTime(Math.floor((Date.now() - recStart)/1000)); }, 250);
        recTimeout = setTimeout(() => { if (isRec) stopRecording(); }, 60000);
        if (navigator.vibrate) navigator.vibrate(40);
    } catch(e) { alert('মাইক অ্যাক্সেস নেই: ' + e.message); resetRec(); }
}
window.stopRecording = () => { if (mediaRecorder && isRec) { try { mediaRecorder.stop(); } catch(e){} isRec=false; } };
window.cancelRecording = () => {
    if (mediaRecorder && isRec) {
        mediaRecorder.onstop = null;
        try { mediaRecorder.stop(); } catch(e){}
        isRec = false;
    }
    resetRec();
};
function resetRec() {
    isRec = false;
    if (recTimer) { clearInterval(recTimer); recTimer = null; }
    if (recTimeout) { clearTimeout(recTimeout); recTimeout = null; }
    $('micBtn').classList.remove('recording');
    $('recBar').classList.remove('show');
    $('recTime').textContent = '00:00';
    mediaRecorder = null; audioChunks = [];
}

function renderEmojiPicker() {
    const p = $('emojiPicker');
    let html = '';
    EMOJI_CATS.forEach(cat => {
        html += `<div class="ep-cat">${cat.name}</div>`;
        cat.list.forEach(e => { html += `<div class="ei" onclick="pickEmoji('${e}')">${e}</div>`; });
    });

}

window.toggleEmojiPicker = (e) => {
    if (e) e.stopPropagation();
    $('emojiPicker').classList.toggle('show');
};

window.pickEmoji = (emoji) => {
    // If single emoji and input empty → send as emoji-only message
    const input = $('messageInput');
    const cur = input.value.trim();
    if (!cur && emoji && !emoji.match(/[\w\u0980-\u09FF]/)) {
        // treat as standalone emoji message
        pushMsg({ type: 'emoji', emoji });
        $('emojiPicker').classList.remove('show');
        return;
    }
    // else insert into input
    input.value = cur + emoji;
    input.focus();
};

document.addEventListener('click', e => {
    const p = $('emojiPicker');
    if (p.classList.contains('show') && !p.contains(e.target) && !e.target.closest('.emoji-trigger')) {
        p.classList.remove('show');
    }
});

/* ========== AUDIO CALL (WebRTC) ========== */
let pc = null, localStream = null, activeCallId = null, isInCall = false;
const RTC_CONFIG = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:stun1.l.google.com:19302' }] };

window.startCall = async () => {
    if (!currentChatUid || isInCall) return;
    if (!myFriends[currentChatUid]) { toast('শুধু বন্ধুদের কল করা যাবে'); return; }
    isInCall = true;
    activeCallId = push(ref(db, 'callSignal')).key;
    $('callAvatar').src = currentChatUser.photo;
    $('callName').textContent = currentChatUser.name;
    $('callStatusText').textContent = 'রিং হচ্ছে...';
    $('callOverlay').classList.add('show');

    try {
        localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        pc = new RTCPeerConnection(RTC_CONFIG);
        localStream.getTracks().forEach(t => pc.addTrack(t, localStream));
        pc.onicecandidate = e => {
            if (e.candidate) push(ref(db, 'callSignal/' + activeCallId + '/callerCandidates'), e.candidate.toJSON());
        };
        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);

        await set(ref(db, 'callSignal/' + activeCallId), {
            callerUid: me.uid, callerName: me.name, callerPhoto: me.photo,
            targetUid: currentChatUid,
            status: 'ringing',
            offer: { type: offer.type, sdp: offer.sdp },
            ts: Date.now()
        });

        // Listen for answer
        onValue(ref(db, 'callSignal/' + activeCallId), async snap => {
            const sig = snap.val();
            if (!sig) return;
            if (sig.status === 'rejected' || sig.status === 'ended') { hangupCall(); return; }
            if (sig.answer && pc && !pc.currentRemoteDescription) {
                await pc.setRemoteDescription(new RTCSessionDescription(sig.answer));
                $('callStatusText').textContent = 'সংযুক্ত 🎧';
            }
        });
        onValue(ref(db, 'callSignal/' + activeCallId + '/calleeCandidates'), snap => {
            snap.forEach(c => { if (c.val() && pc) pc.addIceCandidate(new RTCIceCandidate(c.val())).catch(()=>{}); });
        });
    } catch (e) { toast('কল শুরু হয়নি: ' + e.message); hangupCall(); }
};

window.hangupCall = () => {
    if (activeCallId) {
        update(ref(db, 'callSignal/' + activeCallId), { status: 'ended' }).catch(()=>{});
        setTimeout(() => remove(ref(db, 'callSignal/' + activeCallId)).catch(()=>{}), 500);
    }
    if (pc) { pc.close(); pc = null; }
    if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
    isInCall = false; activeCallId = null;
    $('callOverlay').classList.remove('show');
};

// Listen for incoming calls (only when on chat page)
onValue(ref(db, 'callSignal'), snap => {
    snap.forEach(c => {
        const sig = c.val();
        if (!sig || sig.targetUid !== me.uid || sig.status !== 'ringing' || isInCall) return;
        // Incoming call — accept or reject
        if (Date.now() - sig.ts > 60000) { remove(c.ref); return; }
        if (!confirm(`📞 ${sig.callerName} থেকে অডিও কল আসছে। গ্রহণ করবেন?`)) {
            update(c.ref, { status: 'rejected' });
            return;
        }
        acceptCall(c.key, sig);
    });
});

async function acceptCall(callId, sig) {
    isInCall = true;
    activeCallId = callId;
    $('callAvatar').src = sig.callerPhoto || DEFAULT_AV;
    $('callName').textContent = sig.callerName || 'Unknown';
    $('callStatusText').textContent = 'সংযুক্ত...';
    $('callOverlay').classList.add('show');
    try {
        localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        pc = new RTCPeerConnection(RTC_CONFIG);
        localStream.getTracks().forEach(t => pc.addTrack(t, localStream));
        pc.onicecandidate = e => {
            if (e.candidate) push(ref(db, 'callSignal/' + callId + '/calleeCandidates'), e.candidate.toJSON());
        };
        await pc.setRemoteDescription(new RTCSessionDescription(sig.offer));
        const ans = await pc.createAnswer();
        await pc.setLocalDescription(ans);
        await update(ref(db, 'callSignal/' + callId), { answer: { type: ans.type, sdp: ans.sdp }, status: 'accepted' });
        onValue(ref(db, 'callSignal/' + callId + '/callerCandidates'), s => {
            s.forEach(c => { if (c.val() && pc) pc.addIceCandidate(new RTCIceCandidate(c.val())).catch(()=>{}); });
        });
        onValue(ref(db, 'callSignal/' + callId), snap => {
            const s = snap.val();
            if (s && (s.status === 'ended' || s.status === 'rejected')) hangupCall();
        });
        $('callStatusText').textContent = '🎧 সংযুক্ত';
    } catch (e) { toast('কল গ্রহণ ব্যর্থ: ' + e.message); hangupCall(); }
}

/* ========== HELPERS ========== */
function roomId(a, b) { return [a, b].sort().join('__'); }
function nowTime() { return new Date().toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' }); }
function fmtTime(sec) {
    if (!isFinite(sec) || sec < 0) sec = 0;
    const s = Math.floor(sec);
    return Math.floor(s/60) + ':' + String(s%60).padStart(2,'0');
}
function timeAgo(ts) {
    if (!ts) return '';
    const m = Math.floor((Date.now() - ts) / 60000);
    if (m < 1) return 'এইমাত্র';
    if (m < 60) return m + ' মিনিট';
    const h = Math.floor(m / 60);
    if (h < 24) return h + ' ঘণ্টা';
    const d = Math.floor(h / 24);
    if (d < 7) return d + ' দিন';
    return new Date(ts).toLocaleDateString('bn-BD');
}
window.copyMyUid = () => {
    const text = me.moiId || me.uid;
    navigator.clipboard.writeText(text).then(() => toast('✅ UID কপি: ' + text)).catch(() => toast('UID: ' + text));
};
let toastTimer;
function toast(msg) {
    const t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2400);
}

/* Update unread badge (if embedded in voice club/homepage — parent can read this) */
function updateUnreadBadge() {
    const total = Object.values(chatMetas).reduce((s, m) => s + (m.unread || 0), 0);
    // Inform parent window (voice club / homepage)
    if (IS_EMBEDDED) {
        try {
            window.parent.postMessage({ type: 'CHAT_UNREAD', total }, '*');
        } catch(e){}
    }
}
