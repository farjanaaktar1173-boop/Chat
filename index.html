<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Chat</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',system-ui,'Noto Sans Bengali',Tahoma,sans-serif;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:#0a0616;display:flex;justify-content:center;align-items:center;height:100dvh;overflow:hidden;color:#fff}
.bg-orbs{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.bg-orbs span{position:absolute;border-radius:50%;filter:blur(90px);opacity:.5}
.bg-orbs span:nth-child(1){width:340px;height:340px;background:#a855f7;top:-90px;left:-90px;animation:float1 16s ease-in-out infinite}
.bg-orbs span:nth-child(2){width:300px;height:300px;background:#6366f1;bottom:-100px;right:-80px;animation:float2 19s ease-in-out infinite}
@keyframes float1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(80px,60px) scale(1.25)}}
@keyframes float2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-70px,-70px) scale(1.18)}}

.login-overlay{position:fixed;inset:0;z-index:1000;display:none;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%,#2a1055,#0a0318);padding:30px;text-align:center}
.login-overlay.show{display:flex}
.login-card h1{font-size:24px;font-weight:700;margin-bottom:8px;background:linear-gradient(100deg,#a8fbff,#00f2fe,#a78bfa,#ff2a85);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}

.screen{width:100%;max-width:480px;height:100dvh;display:none;flex-direction:column;background:rgba(20,10,32,.92);backdrop-filter:blur(22px);overflow:hidden;position:relative;z-index:2;padding-bottom:0}
.screen.has-bottom-nav{padding-bottom:70px}
@media(min-width:520px){.screen{height:92dvh;border-radius:28px;border:1px solid rgba(168,85,247,.25)}}
.screen.show{display:flex}

.header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:linear-gradient(135deg,rgba(168,85,247,.4),rgba(99,102,241,.25));border-bottom:1px solid rgba(168,85,247,.2);flex-shrink:0;gap:10px}
.my-profile{display:flex;align-items:center;gap:10px;min-width:0}
.my-av{width:42px;height:42px;border-radius:50%;overflow:hidden;border:2px solid rgba(245,215,110,.6);flex-shrink:0}
.my-av img{width:100%;height:100%;object-fit:cover}
.my-info{min-width:0}
.mname{font-size:14px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
.muid{font-size:9.5px;color:rgba(200,215,235,.75);font-family:monospace;margin-top:1px}
.hdr-actions{display:flex;gap:8px}
.icon-btn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:rgba(168,85,247,.15);border:1px solid rgba(168,85,247,.3);color:#d8b4fe;font-size:14px;cursor:pointer;transition:.25s}
.icon-btn:active{transform:scale(.94)}

.tabs{display:flex;padding:10px 14px 0;gap:8px;flex-shrink:0;border-bottom:1px solid rgba(168,85,247,.15)}
.tab{flex:1;padding:11px 6px;text-align:center;font-size:13px;font-weight:600;color:rgba(200,215,235,.6);cursor:pointer;border-bottom:2px solid transparent;position:relative;transition:.2s}
.tab.active{color:#fff;border-bottom-color:#F5D76E}
.tab-badge{position:absolute;top:6px;right:calc(50% - 34px);background:linear-gradient(135deg,#ef4444,#dc2626);color:#fff;font-size:10px;font-weight:700;min-width:18px;height:18px;border-radius:9px;padding:0 5px;display:none;place-items:center}
.tab-badge.show{display:grid}

.search-wrap{padding:12px 14px 6px;flex-shrink:0}
.search-wrap input{width:100%;padding:11px 16px;border-radius:22px;border:1px solid rgba(168,85,247,.3);background:rgba(168,85,247,.1);color:#fff;font-size:13.5px;outline:none}
.search-wrap input::placeholder{color:rgba(200,215,235,.5)}

.list-area{flex:1;overflow-y:auto;padding:4px 0 20px}
.user-item{display:flex;align-items:center;gap:12px;padding:11px 16px;cursor:pointer;transition:.2s}
.user-item:active{background:rgba(168,85,247,.1)}
.u-avatar{width:52px;height:52px;border-radius:50%;position:relative;flex-shrink:0}
.u-avatar img{width:100%;height:100%;border-radius:50%;object-fit:cover;border:2px solid rgba(168,85,247,.35)}
.u-info{flex:1;min-width:0}
.u-name{font-size:15px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.u-last{font-size:12.5px;color:rgba(255,255,255,.55);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
.u-meta{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex-shrink:0}
.u-time{font-size:11px;color:rgba(200,215,235,.6)}
.u-unread{background:linear-gradient(135deg,#22c55e,#16a34a);color:#fff;font-size:11px;font-weight:700;min-width:22px;height:22px;border-radius:11px;padding:0 7px;display:grid;place-items:center}
.empty{text-align:center;padding:60px 20px;color:rgba(255,255,255,.5);font-size:14px;line-height:1.6}
.empty .big{font-size:52px;margin-bottom:12px;opacity:.6}

.req-card{display:flex;align-items:center;gap:12px;padding:12px 16px;margin:6px 14px;border-radius:16px;background:rgba(168,85,247,.08);border:1px solid rgba(168,85,247,.2)}
.req-card img{width:52px;height:52px;border-radius:50%;object-fit:cover;border:2px solid rgba(245,215,110,.5);flex-shrink:0}
.req-info{flex:1;min-width:0}
.req-info .rn{font-size:14px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.req-info .rt{font-size:11.5px;color:rgba(200,215,235,.7);margin-top:2px}
.req-actions{display:flex;gap:6px;flex-shrink:0}
.req-actions button{padding:8px 12px;border:none;border-radius:10px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit}
.req-actions .acc{background:linear-gradient(135deg,#22c55e,#16a34a);color:#fff}
.req-actions .blk{background:rgba(255,255,255,.08);color:#ff8a9c;border:1px solid rgba(239,68,68,.3)}

/* CHAT SCREEN */
.chat-screen{width:100%;max-width:480px;height:100dvh;display:none;flex-direction:column;background:rgba(20,10,32,.92);backdrop-filter:blur(22px);overflow:hidden;position:relative;z-index:2}
.chat-screen.has-bottom-nav{padding-bottom:70px}
@media(min-width:520px){.chat-screen{height:92dvh;border-radius:28px;border:1px solid rgba(168,85,247,.25)}}
.chat-screen.show{display:flex}

.chat-header{display:flex;align-items:center;padding:12px 14px;background:linear-gradient(135deg,rgba(168,85,247,.4),rgba(99,102,241,.25));border-bottom:1px solid rgba(168,85,247,.2);flex-shrink:0;gap:10px}
.back-btn{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#d8b4fe;font-size:16px;cursor:pointer;flex-shrink:0}
.chat-header .av-wrap{width:44px;height:44px;flex-shrink:0}
.chat-header .av-wrap img{width:100%;height:100%;border-radius:50%;object-fit:cover;border:2px solid rgba(245,215,110,.5)}
.chat-info{flex:1;min-width:0}
.chat-info .cn{font-size:14.5px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-info .cs{font-size:11px;color:rgba(200,215,235,.75);margin-top:1px}

.chat-body{flex:1;padding:18px 14px;overflow-y:auto;display:flex;flex-direction:column;gap:12px;background:radial-gradient(circle at 15% 10%,rgba(168,85,247,.1),transparent 45%),radial-gradient(circle at 85% 85%,rgba(236,72,153,.08),transparent 45%)}

.msg-wrap{display:flex;flex-direction:column;max-width:80%;animation:popIn .4s cubic-bezier(.18,.89,.32,1.28) both;cursor:pointer;position:relative}
@keyframes popIn{from{opacity:0;transform:translateY(14px) scale(.94)}to{opacity:1;transform:translateY(0) scale(1)}}
.msg-wrap.outgoing{align-self:flex-end;align-items:flex-end}
.msg-wrap.incoming{align-self:flex-start;align-items:flex-start}
.msg-bubble{padding:10px 14px;border-radius:19px;font-size:14.5px;line-height:1.55;word-wrap:break-word;width:100%;position:relative}
.msg-bubble.incoming{background:linear-gradient(160deg,rgba(255,255,255,.11),rgba(255,255,255,.05));border:1px solid rgba(168,85,247,.2);color:#eaeaff;border-bottom-left-radius:6px}
.msg-bubble.outgoing{background:linear-gradient(135deg,#a855f7,#6366f1);color:#fff;border-bottom-right-radius:6px;box-shadow:0 10px 26px rgba(168,85,247,.45)}
.msg-bubble img,.msg-bubble video{max-width:100%;border-radius:12px;margin-top:5px;display:block}
.msg-time{font-size:10px;margin-top:5px;opacity:.72;text-align:right;display:flex;align-items:center;justify-content:flex-end;gap:5px}
.msg-bubble.incoming .msg-time{text-align:left;justify-content:flex-start}
.emoji-msg{padding:6px!important;background:transparent!important;border:none!important;box-shadow:none!important}
.emoji-msg .e{font-size:52px;line-height:1;text-align:center;display:block}

.voice-player{display:flex;align-items:center;gap:10px;padding:4px 2px;min-width:200px}
.vp-play{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.22);border:none;color:#fff;cursor:pointer;display:grid;place-items:center;font-size:15px;flex-shrink:0}
.vp-bar{flex:1;height:6px;border-radius:3px;background:rgba(255,255,255,.22);overflow:hidden;position:relative;cursor:pointer;min-width:70px}
.vp-bar-inner{height:100%;width:0%;background:linear-gradient(90deg,#c4b5fd,#fff);border-radius:3px}
.vp-time{font-size:11.5px;opacity:.92;font-variant-numeric:tabular-nums;min-width:42px;text-align:right;font-weight:700}

.reply-bar{display:none;align-items:center;gap:10px;padding:10px 14px;background:rgba(168,85,247,.15);border-top:1px solid rgba(168,85,247,.3);flex-shrink:0}
.reply-bar.show{display:flex}
.rb-left{width:4px;height:38px;border-radius:3px;background:linear-gradient(180deg,#a855f7,#6366f1);flex-shrink:0}
.rb-content{flex:1;min-width:0}
.rb-name{font-size:11.5px;font-weight:700;color:#d8b4fe}
.rb-text{font-size:12.5px;color:rgba(255,255,255,.75);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.rb-close{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.1);border:none;color:#d8b4fe;cursor:pointer;display:grid;place-items:center;font-size:14px;flex-shrink:0}

.quote-box{margin-bottom:6px;padding:7px 10px;border-radius:10px;background:rgba(0,0,0,.22);border-left:3px solid #d8b4fe}
.msg-bubble.outgoing .quote-box{background:rgba(255,255,255,.15);border-left-color:#fff}
.qn{font-size:10.5px;font-weight:700;color:#d8b4fe;margin-bottom:2px}
.qt{font-size:12px;color:rgba(255,255,255,.85);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px}

.rec-bar{display:none;align-items:center;justify-content:center;gap:12px;padding:12px;background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.4);border-radius:20px;margin:6px 12px 0;font-size:13px;color:#fca5a5;font-weight:600;flex-shrink:0}
.rec-bar.show{display:flex}
.rec-bar .dot{width:10px;height:10px;border-radius:50%;background:#ef4444;animation:recPulse 1s ease-in-out infinite}
@keyframes recPulse{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,.7)}50%{box-shadow:0 0 0 10px rgba(239,68,68,0)}}

.chat-footer{display:flex;align-items:center;padding:11px 10px;gap:8px;background:rgba(20,10,32,.9);border-top:1px solid rgba(168,85,247,.2);flex-shrink:0}
.actions{display:flex;gap:6px}
.act-btn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:rgba(168,85,247,.12);border:1px solid rgba(168,85,247,.25);color:#d8b4fe;font-size:15px;cursor:pointer}
.act-btn.recording{background:linear-gradient(135deg,#ef4444,#b91c1c);color:#fff}
.input-box{flex:1;display:flex;align-items:center;background:rgba(168,85,247,.1);border:1px solid rgba(168,85,247,.25);border-radius:22px;padding:9px 12px;gap:6px;min-width:0}
.input-box input{flex:1;border:none;background:transparent;outline:none;font-size:14.5px;color:#fff;min-width:0}
.input-box input::placeholder{color:rgba(200,215,235,.5)}
.emoji-trigger{color:#d8b4fe;font-size:19px;cursor:pointer}
.send-btn{width:44px;height:44px;border-radius:50%;border:none;background:linear-gradient(135deg,#a855f7,#6366f1);color:#fff;font-size:16px;cursor:pointer;display:grid;place-items:center;flex-shrink:0}

.add-friend-cta{padding:16px 14px;background:rgba(168,85,247,.08);border-top:1px solid rgba(168,85,247,.25);flex-shrink:0;text-align:center}
.af-msg{font-size:12.5px;color:rgba(200,215,235,.8);margin-bottom:12px;line-height:1.5}
.af-buttons{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.af-add{padding:12px 22px;border:none;border-radius:14px;font-size:13.5px;font-weight:700;cursor:pointer;font-family:inherit;background:linear-gradient(135deg,#a855f7,#6366f1);color:#fff}
.af-add.sent{background:rgba(34,197,94,.2);color:#86efac;border:1px solid rgba(34,197,94,.4);cursor:default}

.sheet-overlay{position:fixed;inset:0;z-index:2000;display:none;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.65);backdrop-filter:blur(4px)}
.sheet-overlay.show{display:flex}
.sheet{width:100%;max-width:480px;background:rgba(30,15,45,.98);border-top-left-radius:24px;border-top-right-radius:24px;padding:16px 14px 24px;border:1px solid rgba(168,85,247,.3);animation:sheetUp .3s cubic-bezier(.2,.8,.2,1.2) both;padding-bottom:calc(24px + env(safe-area-inset-bottom))}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.sheet-handle{width:44px;height:4px;border-radius:3px;background:rgba(168,85,247,.5);margin:0 auto 14px}
.sheet-btn{width:100%;padding:14px 16px;background:rgba(168,85,247,.12);border:1px solid rgba(168,85,247,.25);color:#fff;font-size:14px;font-weight:600;border-radius:14px;cursor:pointer;display:flex;align-items:center;gap:12px;font-family:inherit;margin-bottom:8px;text-align:left}
.sheet-btn i{width:22px;color:#d8b4fe;font-size:16px}
.sheet-btn.danger{background:rgba(239,68,68,.15);border-color:rgba(239,68,68,.4);color:#fca5a5}
.sheet-btn.cancel{background:rgba(255,255,255,.06);justify-content:center;color:rgba(255,255,255,.7);border-color:rgba(255,255,255,.1)}

.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%) translateY(30px);padding:11px 22px;border-radius:16px;background:rgba(168,85,247,.95);color:#fff;font-size:13.5px;font-weight:600;z-index:5000;box-shadow:0 14px 32px rgba(168,85,247,.6);opacity:0;transition:.3s;pointer-events:none;max-width:90%;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.emoji-picker{position:absolute;bottom:140px;left:10px;right:10px;max-height:290px;overflow-y:auto;display:none;grid-template-columns:repeat(8,1fr);gap:4px;padding:12px;border-radius:20px;background:rgba(30,15,45,.98);backdrop-filter:blur(26px);border:1px solid rgba(168,85,247,.35);z-index:100}
.emoji-picker.show{display:grid}
.emoji-picker .ep-cat{grid-column:1/-1;font-size:11px;color:#d8b4fe;font-weight:700;padding:8px 4px 4px;text-transform:uppercase}
.ei{aspect-ratio:1/1;display:grid;place-items:center;font-size:24px;cursor:pointer;border-radius:10px;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.ei:hover{background:rgba(168,85,247,.25)}

/* SEARCH USERS OVERLAY */
.search-users-overlay{position:fixed;inset:0;z-index:3000;background:#0a0616;display:none;flex-direction:column;padding-top:env(safe-area-inset-top)}
.search-users-overlay.show{display:flex}
.su-header{display:flex;align-items:center;gap:10px;padding:14px 14px 12px;border-bottom:1px solid rgba(168,85,247,.15)}
.su-back{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#d8b4fe;font-size:16px;cursor:pointer;flex-shrink:0;background:rgba(168,85,247,.12);border:1px solid rgba(168,85,247,.25)}
.su-input-wrap{flex:1;display:flex;align-items:center;gap:10px;padding:10px 14px;background:rgba(168,85,247,.1);border:1px solid rgba(168,85,247,.3);border-radius:22px}
.su-input-wrap i:first-child{color:#d8b4fe;font-size:14px}
.su-input-wrap input{flex:1;background:transparent;border:none;outline:none;color:#fff;font-size:14px;font-family:inherit}
.su-input-wrap input::placeholder{color:rgba(200,215,235,.5)}
#suClear{cursor:pointer;color:#d8b4fe;font-size:14px;display:none}
.su-hint{display:flex;align-items:center;gap:8px;padding:10px 18px;font-size:11.5px;color:rgba(200,215,235,.6);line-height:1.4}
.su-hint i{color:#d8b4fe;font-size:11px;flex-shrink:0}
.su-body{flex:1;overflow-y:auto;padding:6px 12px 24px}
.su-empty{display:flex;flex-direction:column;align-items:center;padding:60px 20px;text-align:center}
.su-empty-icon{font-size:52px;opacity:.6;margin-bottom:14px}
.su-empty-text{font-size:15px;font-weight:600;color:#fff;margin-bottom:6px}
.su-empty-sub{font-size:12.5px;color:rgba(200,215,235,.6)}
.su-loading{text-align:center;padding:40px 20px;color:rgba(200,215,235,.6);font-size:13px}
.su-loading .spinner-sm{display:inline-block;width:24px;height:24px;border:3px solid rgba(168,85,247,.2);border-top-color:#a855f7;border-radius:50%;animation:spinSm .9s linear infinite;margin-bottom:12px}
@keyframes spinSm{to{transform:rotate(360deg)}}

.su-user-card{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;background:rgba(168,85,247,.06);border:1px solid rgba(168,85,247,.18);margin-bottom:8px;transition:.2s}
.su-user-avatar{width:54px;height:54px;border-radius:50%;object-fit:cover;border:2px solid rgba(168,85,247,.4);flex-shrink:0}
.su-user-info{flex:1;min-width:0}
.su-user-name{font-size:14.5px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.su-user-id{font-size:11.5px;color:rgba(200,215,235,.65);font-family:monospace;margin-top:3px}
.su-user-btn{padding:9px 14px;border-radius:12px;border:none;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;flex-shrink:0;display:flex;align-items:center;gap:5px;transition:.2s}
.su-user-btn.add{background:linear-gradient(135deg,#a855f7,#6366f1);color:#fff}
.su-user-btn.sent{background:rgba(34,197,94,.15);color:#86efac;border:1px solid rgba(34,197,94,.4);cursor:default}
.su-user-btn.friend{background:rgba(34,197,94,.2);color:#22c55e;border:1px solid rgba(34,197,94,.5);cursor:pointer}
.su-user-btn.self{background:rgba(255,255,255,.06);color:rgba(255,255,255,.5);cursor:default}
.su-user-btn.incoming{background:linear-gradient(135deg,#22c55e,#16a34a);color:#fff}

/* BOTTOM NAV */
.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;display:none;justify-content:space-around;align-items:center;padding:10px 14px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(20,10,32,.72),rgba(10,6,22,.98));backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);z-index:600;border-top:1px solid rgba(168,85,247,.2)}
.bottom-nav.show{display:flex}
@media(min-width:520px){.bottom-nav{border-radius:0 0 28px 28px;bottom:4dvh}}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:4px;text-decoration:none;color:rgba(200,215,235,.55);font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;transition:.25s;padding:2px 12px;cursor:pointer;background:none;border:none;font-family:inherit}
.nav-item .nav-icon{width:42px;height:34px;border-radius:12px;display:grid;place-items:center;font-size:18px;transition:.25s}
.nav-item:active{transform:scale(.94)}
.nav-item.active{color:#F5D76E}
.nav-item.active .nav-icon{background:linear-gradient(160deg,rgba(245,215,110,.22),rgba(245,215,110,.05));border:1px solid rgba(245,215,110,.45);color:#f4dc8a;box-shadow:0 0 20px rgba(245,215,110,.28)}
</style>
</head>
<body>

<div class="bg-orbs"><span></span><span></span></div>

<div class="login-overlay" id="loginOverlay">
    <div class="login-card">
        <h1>Chat</h1>
        <p>চ্যাট করতে লগইন করুন</p>
    </div>
</div>

<!-- MAIN LIST SCREEN -->
<div class="screen" id="mainScreen">
    <div class="header">
        <div class="my-profile">
            <div class="my-av"><img id="myAvatar" src="" alt=""></div>
            <div class="my-info">
                <div class="mname" id="myName">—</div>
                <div class="muid" id="myUid">—</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
import {
  getFirestore, doc, getDoc, setDoc, updateDoc, deleteDoc,
  onSnapshot, collection, query, orderBy, limit,
  addDoc, where, getDocs
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

/* ========== FIREBASE ========== */
const firebaseConfig = {
  apiKey: "AIzaSyCTn3QEYtRMxm7Y91RSFSvbRJSRHcXMEdI",
  authDomain: "room-7fbf7.firebaseapp.com",
  databaseURL: "https://room-7fbf7-default-rtdb.firebaseio.com",
  projectId: "room-7fbf7",
  storageBucket: "room-7fbf7.firebasestorage.app",
  messagingSenderId: "417946695868",
  appId: "1:417946695868:web:564bb9c8a06f7c90b2b8b9"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DEFAULT_AV = 'data:image/svg+xml;utf8,' + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="50" fill="#3b2a4f"/><circle cx="50" cy="40" r="18" fill="#7a6a8f"/><ellipse cx="50" cy="88" rx="30" ry="22" fill="#7a6a8f"/></svg>`);

/* ========== STATE ========== */
let me = null;
let myFriends = {};
let myRequests = {};
let mySentRequests = {};
let chatMetas = {};
let currentChatUid = null;
let currentChatUser = null;
let chatUnsub = null;
let replyTarget = null;
let renderedMsgs = new Set();
let allProfilesCache = {};
let listenersAttached = false;

const params = new URLSearchParams(location.search);
const TARGET_UID = params.get('targetUid') || '';
const IS_EMBEDDED = window.self !== window.top;

/* ========== BOTTOM NAV ========== */
function setupBottomNav(){
  if (IS_EMBEDDED){
    // iframe-এ আছে — Bottom nav দেখাবো না (parent-এর nav আছে)
    $('bottomNav').classList.remove('show');
    $('mainScreen').classList.remove('has-bottom-nav');
    $('chatScreen').classList.remove('has-bottom-nav');
  } else {
    // Standalone — Bottom nav দেখাবো
    $('bottomNav').classList.add('show');
    $('mainScreen').classList.add('has-bottom-nav');
    $('chatScreen').classList.add('has-bottom-nav');
  }
}

window.goHome = () => {
  window.location.href = "https://farjanaaktar1173-boop.github.io/Homepage/";
};
window.goMe = () => {
  window.location.href = "https://farjanaaktar1173-boop.github.io/Me/";
};

/* ========== BOOTSTRAP (localStorage থেকে দ্রুত লোড) ========== */
(function bootstrap(){
  setupBottomNav();
  try {
    const s = localStorage.getItem("moi_user");
    if (!s) return;
    const u = JSON.parse(s);
    if (!u || !u.uid) return;
    me = {
      uid: u.uid,
      name: u.name || "User",
      photo: u.photo || u.avatar || DEFAULT_AV,
      moiId: u.moiId || ""
    };
    initUIFast();
  } catch(e){ console.warn(e); }
})();

function initUIFast(){
  $('myAvatar').src = me.photo || DEFAULT_AV;
  $('myName').textContent = me.name;
  $('myUid').textContent = '🆔 ' + (me.moiId || me.uid.slice(0,8));
  attachListeners();
  renderEmojiPicker();
  $('mainScreen').classList.add('show');
  if (TARGET_UID && TARGET_UID !== me.uid){
    setTimeout(() => openChatWith(TARGET_UID), 400);
  }
}

/* ========== AUTH ========== */
onAuthStateChanged(auth, async user => {
  if (!user && !me){
    $('loginOverlay').classList.add('show');
    return;
  }
  if (!user) return;   // localStorage user already loaded

  $('loginOverlay').classList.remove('show');

  let profile = {
    uid: user.uid,
    name: user.displayName || (user.email ? user.email.split('@')[0] : 'User'),
    photo: user.photoURL || DEFAULT_AV,
    moiId: ''
  };
  try {
    const snap = await getDoc(doc(db, 'users', user.uid));
    if (snap.exists()){
      const u = snap.data();
      profile.name = u.name || profile.name;
      profile.photo = u.photo || u.avatar || profile.photo;
      profile.moiId = u.moiId || '';
    }
  } catch(e){}

  // যদি localStorage থেকে আগেই লোড হয়, শুধু refresh করি
  const wasLoaded = !!me;
  me = profile;

  $('myAvatar').src = me.photo || DEFAULT_AV;
  $('myName').textContent = me.name;
  $('myUid').textContent = '🆔 ' + (me.moiId || me.uid.slice(0,8));

  if (!wasLoaded){
    attachListeners();
    renderEmojiPicker();
    $('mainScreen').classList.add('show');
    if (TARGET_UID && TARGET_UID !== me.uid){
      setTimeout(() => openChatWith(TARGET_UID), 400);
    }
  }
});

/* ========== LISTENERS ========== */
function attachListeners(){
  if (listenersAttached) return;
  listenersAttached = true;

  onSnapshot(collection(db, 'users', me.uid, 'friends'), snap => {
    myFriends = {};
    snap.forEach(d => myFriends[d.id] = d.data());
    renderList();
    if (currentChatUid) updateFriendStatus();
  });
  onSnapshot(collection(db, 'users', me.uid, 'sentRequests'), snap => {
    mySentRequests = {};
    snap.forEach(d => mySentRequests[d.id] = true);
    renderList();
    if (currentChatUid) updateFriendStatus();
  });
  onSnapshot(collection(db, 'friendRequests', me.uid, 'items'), snap => {
    myRequests = {};
    snap.forEach(d => myRequests[d.id] = d.data());
    updateReqBadge();
    renderList();
    if (currentChatUid) updateFriendStatus();
  });
  onSnapshot(collection(db, 'userChatMeta', me.uid), snap => {
    chatMetas = {};
    snap.forEach(d => chatMetas[d.id] = d.data());
    renderList();
  });
}

/* ========== TABS ========== */
let activeTab = 'friends';
window.switchTab = (t) => {
  activeTab = t;
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('active', x.dataset.tab === t));
  $('searchWrap').style.display = (t === 'friends') ? '' : 'none';
  renderList();
};

function updateReqBadge(){
  const n = Object.keys(myRequests).length;
  const b = $('reqBadge');
  b.textContent = n;
  b.classList.toggle('show', n > 0);
}

/* ========== LOAD PROFILE ========== */
async function loadProfile(uid){
  if (allProfilesCache[uid]) return allProfilesCache[uid];
  try {
    const snap = await getDoc(doc(db, 'users', uid));
    if (snap.exists()){
      allProfilesCache[uid] = { uid, ...snap.data() };
      return allProfilesCache[uid];
    }
  } catch(e){}
  return { uid, name: 'User', photo: DEFAULT_AV };
}

/* ========== RENDER LIST ========== */
async function renderList(){
  const area = $('listArea');
  if (!me) return;

  if (activeTab === 'requests'){
    const list = Object.values(myRequests);
    if (!list.length){
      area.innerHTML = '<div class="empty"><div class="big">📩</div>এখনো কোনো অনুরোধ নেই</div>';
      return;
    }
    area.innerHTML = list.map(r => `
      <div class="req-card">
        <img src="${esc(r.fromPhoto || DEFAULT_AV)}">
        <div class="req-info">
          <div class="rn">${esc(r.fromName || 'User')}</div>
          <div class="rt">আপনাকে বন্ধু হতে চায়</div>
        </div>
        <div class="req-actions">
          <button class="acc" onclick="acceptRequest('${esc(r.fromUid)}')">✓ Accept</button>
          <button class="blk" onclick="blockRequest('${esc(r.fromUid)}')">Block</button>
        </div>
      </div>`).join('');
    return;
  }

  const search = ($('searchInput').value || '').trim().toLowerCase();
  const friendUids = Object.keys(myFriends);

  if (!friendUids.length){
    area.innerHTML = '<div class="empty"><div class="big">👥</div>এখনো কোনো বন্ধু নেই<br><br>উপরের 🔍 আইকনে ট্যাপ করে<br>নতুন বন্ধু খুঁজুন</div>';
    return;
  }

  const profiles = await Promise.all(friendUids.map(uid => loadProfile(uid)));
  const friends = profiles.map(p => {
    const meta = chatMetas[p.uid] || {};
    return {
      uid: p.uid,
      name: p.name || 'User',
      photo: p.photo || p.avatar || DEFAULT_AV,
      lastMsg: meta.lastMessage || '',
      lastType: meta.lastType || 'text',
      lastSender: meta.lastSender || '',
      lastTime: meta.lastTime || 0,
      unread: meta.unread || 0
    };
  }).filter(f => !search || f.name.toLowerCase().includes(search));

  friends.sort((a,b) => {
    if (a.unread !== b.unread) return b.unread - a.unread;
    return (b.lastTime || 0) - (a.lastTime || 0);
  });

  if (!friends.length){
    area.innerHTML = '<div class="empty"><div class="big">🔍</div>কিছু পাওয়া যায়নি</div>';
    return;
  }

  area.innerHTML = friends.map(f => friendRowHTML(f)).join('');
}

function friendRowHTML(f){
  let preview;
  if (f.lastType === 'image') preview = '📷 ছবি';
  else if (f.lastType === 'video') preview = '🎬 ভিডিও';
  else if (f.lastType === 'audio') preview = '🎤 ভয়েস';
  else preview = f.lastMsg || 'কথা বলুন...';
  const senderTag = f.lastSender === me.uid ? '<span style="color:#c4b5fd;font-weight:600">আপনি: </span>' : '';
  const timeStr = f.lastTime ? timeAgo(f.lastTime) : '';
  const unreadHtml = f.unread > 0 ? `<div class="u-unread">${f.unread > 99 ? '99+' : f.unread}</div>` : '';

  return `<div class="user-item" onclick="openChatWith('${esc(f.uid)}')">
    <div class="u-avatar"><img src="${esc(f.photo)}" onerror="this.src='${DEFAULT_AV}'"></div>
    <div class="u-info">
      <div class="u-name">${esc(f.name)}</div>
      <div class="u-last">${senderTag}${esc(preview)}</div>
    </div>
    <div class="u-meta">
      <div class="u-time">${esc(timeStr)}</div>
      ${unreadHtml}
    </div>
  </div>`;
}

/* ========== FRIEND REQUESTS ========== */
window.sendFriendRequest = async () => {
  if (!me || !currentChatUid) return;
  if (myFriends[currentChatUid]) return;
  if (mySentRequests[currentChatUid]){ toast('✅ ইতিমধ্যে পাঠানো হয়েছে'); return; }
  try {
    await setDoc(doc(db, 'friendRequests', currentChatUid, 'items', me.uid), {
      fromUid: me.uid, fromName: me.name, fromPhoto: me.photo, ts: Date.now()
    });
    await setDoc(doc(db, 'users', me.uid, 'sentRequests', currentChatUid), { ts: Date.now() });
    toast('✅ অনুরোধ পাঠানো হয়েছে');
    updateFriendStatus();
  } catch(e){ toast('❌ ' + e.message); }
};

window.acceptRequest = async (fromUid) => {
  if (!me || !fromUid) return;
  try {
    await setDoc(doc(db, 'users', me.uid, 'friends', fromUid), { since: Date.now(), uid: fromUid });
    await setDoc(doc(db, 'users', fromUid, 'friends', me.uid), { since: Date.now(), uid: me.uid });
    await deleteDoc(doc(db, 'friendRequests', me.uid, 'items', fromUid));
    await deleteDoc(doc(db, 'users', fromUid, 'sentRequests', me.uid));
    toast('🎉 আপনি এখন বন্ধু');
  } catch(e){ toast('❌ ' + e.message); }
};

window.blockRequest = async (fromUid) => {
  if (!fromUid) return;
  try {
    await deleteDoc(doc(db, 'friendRequests', me.uid, 'items', fromUid));
    await deleteDoc(doc(db, 'users', fromUid, 'sentRequests', me.uid));
    toast('🚫 ব্লক করা হয়েছে');
  } catch(e){ toast('❌ ' + e.message); }
};

/* ========== CHAT ID ========== */
function chatId(a, b){ return [a, b].sort().join('__'); }

/* ========== OPEN CHAT ========== */
window.openChatWith = async (uid) => {
  if (!me || !uid || uid === me.uid) return;
  if (chatUnsub){ chatUnsub(); chatUnsub = null; }
  currentChatUid = uid;

  const profile = await loadProfile(uid);
  currentChatUser = { uid, name: profile.name || 'User', photo: profile.photo || profile.avatar || DEFAULT_AV };

  $('mainScreen').classList.remove('show');
  $('chatScreen').classList.add('show');
  $('chatName').textContent = currentChatUser.name;
  $('chatAvatar').src = currentChatUser.photo;
  $('chatBody').innerHTML = '';
  $('messageInput').value = '';
  cancelReply();
  renderedMsgs.clear();

  try {
    await setDoc(doc(db, 'userChatMeta', me.uid, uid), { unread: 0 }, { merge: true });
  } catch(e){}

  updateFriendStatus();

  const cid = chatId(me.uid, uid);
  const msgsRef = collection(db, 'chats', cid, 'messages');
  const q = query(msgsRef, orderBy('ts', 'asc'), limit(200));
  chatUnsub = onSnapshot(q, snap => {
    snap.docChanges().forEach(change => {
      const data = change.doc.data();
      const key = change.doc.id;
      if (change.type === 'added'){
        if (renderedMsgs.has(key)) return;
        if (data.deletedFor && Array.isArray(data.deletedFor) && data.deletedFor.includes(me.uid)) return;
        renderedMsgs.add(key);
        renderMessage(data, key);
        if (data.senderUid && data.senderUid !== me.uid){
          updateDoc(doc(db, 'chats', cid, 'messages', key), {
            [`deliveredTo.${me.uid}`]: true,
            [`readBy.${me.uid}`]: true
          }).catch(() => {});
        }
      } else if (change.type === 'modified'){
        const el = $('chatBody').querySelector('[data-key="' + key + '"]');
        if (el) updateMsgTicks(el, data);
      } else if (change.type === 'removed'){
        const el = $('chatBody').querySelector('[data-key="' + key + '"]');
        if (el){ el.style.opacity = '0'; setTimeout(() => el.remove(), 300); }
      }
    });
  });

  setTimeout(() => $('messageInput').focus(), 250);
};

window.backToList = () => {
  if (chatUnsub){ chatUnsub(); chatUnsub = null; }
  $('chatScreen').classList.remove('show');
  $('mainScreen').classList.add('show');
  currentChatUid = null;
  currentChatUser = null;
  cancelReply();
  if (TARGET_UID) history.replaceState({}, '', location.pathname);
};

/* ========== FRIEND STATUS ========== */
function updateFriendStatus(){
  if (!currentChatUid) return;
  const isFriend = !!myFriends[currentChatUid];
  const isSent = !!mySentRequests[currentChatUid];
  const isIncoming = !!myRequests[currentChatUid];

  if (isFriend){
    $('chatFooter').style.display = '';
    $('addFriendCta').style.display = 'none';
    $('chatStatus').textContent = 'Tap to chat';
  } else {
    $('chatFooter').style.display = 'none';
    $('addFriendCta').style.display = '';
    $('chatStatus').textContent = 'Not a friend';
    const wrap = $('afButtons');
    if (isIncoming){
      wrap.innerHTML = `<button class="af-add" onclick="acceptRequest('${esc(currentChatUid)}')"><i class="fa-solid fa-check"></i> Accept</button>`;
    } else if (isSent){
      wrap.innerHTML = `<button class="af-add sent" disabled><i class="fa-solid fa-check"></i> Request Sent</button>`;
    } else {
      wrap.innerHTML = `<button class="af-add" onclick="sendFriendRequest()"><i class="fa-solid fa-user-plus"></i> Add Friend</button>`;
    }
  }
}

/* ========== RENDER MESSAGE ========== */
function renderMessage(data, key){
  const isMe = data.senderUid === me.uid;
  const wrap = document.createElement('div');
  wrap.className = 'msg-wrap ' + (isMe ? 'outgoing' : 'incoming');
  wrap.dataset.key = key;
  wrap.dataset.isMe = isMe ? '1' : '0';

  let tick = '';
  if (isMe) tick = tickHtml(data);

  let quote = '';
  if (data.replyTo){
    const r = data.replyTo;
    quote = `<div class="quote-box"><div class="qn">${esc(r.senderName||'')}</div><div class="qt">${esc(r.preview||'')}</div></div>`;
  }

  let inner = '';
  const t = data.type || 'text';
  const bubble = `msg-bubble ${isMe?'outgoing':'incoming'}`;
  if (t === 'text'){
    inner = `<div class="${bubble}">${quote}${esc(data.content)}<div class="msg-time">${esc(data.time||'')}${tick}</div></div>`;
  } else if (t === 'image'){
    inner = `<div class="${bubble}">${quote}<img src="${data.content}"><div class="msg-time">${esc(data.time||'')}${tick}</div></div>`;
  } else if (t === 'video'){
    inner = `<div class="${bubble}">${quote}<video src="${data.content}" controls></video><div class="msg-time">${esc(data.time||'')}${tick}</div></div>`;
  } else if (t === 'audio'){
    inner = `<div class="${bubble}">${quote}<div class="voice-player"><button class="vp-play"><i class="fa-solid fa-play"></i></button><div class="vp-bar"><div class="vp-bar-inner"></div></div><span class="vp-time">${fmtTime(data.duration||0)}</span><audio preload="metadata" src="${data.content}"></audio></div><div class="msg-time">${esc(data.time||'')}${tick}</div></div>`;
  } else if (t === 'emoji'){
    inner = `<div class="msg-bubble emoji-msg ${isMe?'outgoing':'incoming'}">${quote}<span class="e">${data.emoji || '😊'}</span><div class="msg-time" style="justify-content:center;opacity:.5">${esc(data.time||'')}${tick}</div></div>`;
  }
  wrap.innerHTML = inner;
  if (t === 'audio') setupVoicePlayer(wrap);

  let pressTimer = null;
  const openSheet = () => openMsgActionSheet(key, data, isMe);
  const clearP = () => { if (pressTimer){ clearTimeout(pressTimer); pressTimer = null; } };
  wrap.addEventListener('touchstart', () => { pressTimer = setTimeout(openSheet, 550); }, {passive:true});
  wrap.addEventListener('touchend', clearP);
  wrap.addEventListener('touchmove', clearP);
  wrap.addEventListener('contextmenu', e => { e.preventDefault(); openSheet(); });

  let sx = 0, sy = 0, sw = false;
  wrap.addEventListener('touchstart', e => {
    const t = e.touches[0]; sx = t.clientX; sy = t.clientY; sw = true;
  }, {passive:true});
  wrap.addEventListener('touchmove', e => {
    if (!sw) return;
    const t = e.touches[0];
    const dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.abs(dy) > 30){ sw = false; return; }
    if (dx > 20 && Math.abs(dx) > Math.abs(dy)) wrap.style.transform = `translateX(${Math.min(dx, 60)}px)`;
  }, {passive:true});
  wrap.addEventListener('touchend', e => {
    if (!sw){ wrap.style.transform = ''; return; }
    const t = e.changedTouches[0];
    if (t.clientX - sx > 55){ setReply(data, key); if (navigator.vibrate) navigator.vibrate(20); }
    wrap.style.transform = '';
    sw = false;
  });

  $('chatBody').appendChild(wrap);
  $('chatBody').scrollTop = $('chatBody').scrollHeight;
}

function tickHtml(data){
  if (data.readBy && Object.keys(data.readBy).length > 0 && !data.readBy[me.uid]){
    return '<i class="fa-solid fa-circle-check" style="color:#7fe6ff;font-size:11px"></i>';
  }
  if (data.deliveredTo && Object.keys(data.deliveredTo).length > 0){
    return '<i class="fa-solid fa-check-double" style="font-size:11px;opacity:.9"></i>';
  }
  return '<i class="fa-solid fa-check" style="font-size:11px;opacity:.7"></i>';
}

function updateMsgTicks(el, data){
  const timeDiv = el.querySelector('.msg-time');
  if (!timeDiv) return;
  const existing = timeDiv.querySelector('i');
  const newTick = tickHtml(data);
  if (existing) existing.outerHTML = newTick;
}

function setReply(data, key){
  let preview = '';
  if (data.type === 'text') preview = data.content || '';
  else if (data.type === 'image') preview = '📷 ছবি';
  else if (data.type === 'video') preview = '🎬 ভিডিও';
  else if (data.type === 'audio') preview = '🎤 ভয়েস';
  else if (data.type === 'emoji') preview = data.emoji || '😊';
  replyTarget = { key, senderName: data.senderUid === me.uid ? 'আপনি' : (data.senderName || ''), preview };
  $('replyName').textContent = '↩ ' + replyTarget.senderName;
  $('replyText').textContent = preview;
  $('replyBar').classList.add('show');
  $('messageInput').focus();
}
window.cancelReply = () => { replyTarget = null; $('replyBar').classList.remove('show'); };

/* ========== VOICE PLAYER ========== */
function setupVoicePlayer(wrap){
  const btn = wrap.querySelector('.vp-play');
  const audio = wrap.querySelector('audio');
  const bar = wrap.querySelector('.vp-bar');
  const barI = wrap.querySelector('.vp-bar-inner');
  const time = wrap.querySelector('.vp-time');
  const icon = btn.querySelector('i');
  if (!audio) return;
  audio.addEventListener('timeupdate', () => {
    if (audio.duration && isFinite(audio.duration)){
      barI.style.width = (audio.currentTime / audio.duration * 100) + '%';
      time.textContent = fmtTime(audio.currentTime);
    }
  });
  audio.addEventListener('ended', () => { icon.className = 'fa-solid fa-play'; barI.style.width = '0%'; });
  btn.addEventListener('click', e => {
    e.stopPropagation();
    if (audio.paused){ audio.play(); icon.className = 'fa-solid fa-pause'; }
    else { audio.pause(); icon.className = 'fa-solid fa-play'; }
  });
}

/* ========== ACTION SHEET ========== */
let sheetTargetKey = null, sheetTargetData = null;
function openMsgActionSheet(key, data, isMe){
  sheetTargetKey = key; sheetTargetData = data;
  let html = `<button class="sheet-btn" onclick="doReply()"><i class="fa-solid fa-reply"></i> রিপ্লাই</button>`;
  if (data.type === 'text') html += `<button class="sheet-btn" onclick="doCopyMsg()"><i class="fa-solid fa-copy"></i> কপি</button>`;

  if (isMe) html += `<button class="sheet-btn danger" onclick="doDeleteForAll()"><i class="fa-solid fa-trash-can"></i> সবার জন্য ডিলিট</button>`;

window.closeMsgSheet = () => { $('msgSheet').classList.remove('show'); sheetTargetKey = null; sheetTargetData = null; };
window.doReply = () => { if (sheetTargetData) setReply(sheetTargetData, sheetTargetKey); closeMsgSheet(); };

window.doDeleteForMe = async () => {
  if (!sheetTargetKey || !currentChatUid){ closeMsgSheet(); return; }
  const cid = chatId(me.uid, currentChatUid);
  try {
    const ref = doc(db, 'chats', cid, 'messages', sheetTargetKey);
    const snap = await getDoc(ref);
    const cur = snap.data()?.deletedFor || [];
    if (!cur.includes(me.uid)) cur.push(me.uid);
    await updateDoc(ref, { deletedFor: cur });

    if (el){ el.style.opacity = '0'; setTimeout(() => el.remove(), 300); }
    toast('✅ ডিলিট হয়েছে');
  } catch(e){ toast('❌ ' + e.message); }
  closeMsgSheet();
};
window.doDeleteForAll = async () => {
  if (!sheetTargetKey || !currentChatUid){ closeMsgSheet(); return; }
  const cid = chatId(me.uid, currentChatUid);
  try {
    await deleteDoc(doc(db, 'chats', cid, 'messages', sheetTargetKey));

  } catch(e){ toast('❌ ' + e.message); }

};

/* ========== SEND ========== */
async function pushMsg(payload){
  if (!currentChatUid) return;
  const cid = chatId(me.uid, currentChatUid);
  payload.senderUid = me.uid;
  payload.senderName = me.name;
  payload.senderPhoto = me.photo;
  payload.time = nowTime();
  payload.ts = Date.now();
  payload.deliveredTo = { [me.uid]: true };
  if (replyTarget) payload.replyTo = replyTarget;
  await addDoc(collection(db, 'chats', cid, 'messages'), payload);

  let preview = '';
  if (payload.type === 'text') preview = payload.content;
  else if (payload.type === 'image') preview = '📷 ছবি';
  else if (payload.type === 'video') preview = '🎬 ভিডিও';
  else if (payload.type === 'audio') preview = '🎤 ভয়েস';
  else if (payload.type === 'emoji') preview = payload.emoji;

  const now = Date.now();
  const meta = { lastMessage: preview, lastTime: now, lastSender: me.uid, lastType: payload.type };
  await setDoc(doc(db, 'userChatMeta', me.uid, currentChatUid), meta, { merge: true });
  await setDoc(doc(db, 'userChatMeta', currentChatUid, me.uid), meta, { merge: true });
  const theirMetaSnap = await getDoc(doc(db, 'userChatMeta', currentChatUid, me.uid));
  const curUnread = theirMetaSnap.data()?.unread || 0;
  await updateDoc(doc(db, 'userChatMeta', currentChatUid, me.uid), { unread: curUnread + 1 });

  cancelReply();
}

window.sendText = () => {
  const t = $('messageInput').value.trim();
  if (!t) return;
  pushMsg({ type: 'text', content: t });
  $('messageInput').value = '';
  $('messageInput').focus();
};

window.sendFile = (e, type) => {
  const f = e.target.files[0];
  if (!f) return;
  if (f.size > 15 * 1024 * 1024){ alert('ফাইল বড়! ১৫ MB এর কম দিন।'); e.target.value=''; return; }
  const r = new FileReader();
  r.onload = ev => pushMsg({ type, content: ev.target.result });
  r.readAsDataURL(f);
  e.target.value = '';
};

/* ========== RECORDING ========== */
let mediaRecorder = null, audioChunks = [], isRec = false, recTimer = null, recStart = 0;
window.toggleRecording = async () => { if (isRec) stopRecording(); else await startRecording(); };
async function startRecording(){
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio:true });
    audioChunks = [];
    let mime = '';
    if (MediaRecorder.isTypeSupported('audio/webm;codecs=opus')) mime = 'audio/webm;codecs=opus';
    else if (MediaRecorder.isTypeSupported('audio/webm')) mime = 'audio/webm';
    mediaRecorder = mime ? new MediaRecorder(stream, { mimeType: mime }) : new MediaRecorder(stream);
    mediaRecorder.ondataavailable = e => { if (e.data && e.data.size) audioChunks.push(e.data); };
    mediaRecorder.onstop = () => {
      stream.getTracks().forEach(t => t.stop());
      const blob = new Blob(audioChunks, { type: mime || 'audio/webm' });
      const dur = Math.round((Date.now() - recStart) / 1000);
      if (blob.size < 800 || dur < 1){ resetRec(); return; }
      const rd = new FileReader();
      rd.onload = () => { pushMsg({ type: 'audio', content: rd.result, duration: dur }); };
      rd.readAsDataURL(blob);
      resetRec();
    };
    mediaRecorder.start();
    isRec = true;
    recStart = Date.now();
    $('micBtn').classList.add('recording');
    $('recBar').classList.add('show');
    $('recTime').textContent = '00:00';
    recTimer = setInterval(() => { $('recTime').textContent = fmtTime(Math.floor((Date.now() - recStart) / 1000)); }, 250);
  } catch(e){ alert('মাইক নেই: ' + e.message); resetRec(); }
}
window.stopRecording = () => { if (mediaRecorder && isRec){ try { mediaRecorder.stop(); } catch(e){} isRec = false; } };
window.cancelRecording = () => {
  if (mediaRecorder && isRec){ mediaRecorder.onstop = null; try { mediaRecorder.stop(); } catch(e){} isRec = false; }
  resetRec();
};
function resetRec(){
  isRec = false;
  if (recTimer){ clearInterval(recTimer); recTimer = null; }
  $('micBtn').classList.remove('recording');
  $('recBar').classList.remove('show');
  mediaRecorder = null; audioChunks = [];
}

};

async function performUserSearch(query){
  const body = $('suBody');
  body.innerHTML = `<div class="su-loading"><div class="spinner-sm"></div><div>খোঁজা হচ্ছে...</div></div>`;

  try {
    let results = [];

    if (/^\d{4,10}$/.test(query)){
      try {
        const q1 = query(collection(db, 'users'), where('moiId', '==', query), limit(10));
        const snap1 = await getDocs(q1);
        snap1.forEach(d => {
          if (!results.find(r => r.uid === d.id)) results.push({ uid: d.id, ...d.data() });
        });
      } catch(e){ console.warn('moiId search:', e); }
    }

    try {
      const q2 = query(
        collection(db, 'users'),
        where('name', '>=', query),
        where('name', '<=', query + '\uf8ff'),
        limit(20)
      );
      const snap2 = await getDocs(q2);
      snap2.forEach(d => {
        if (!results.find(r => r.uid === d.id)) results.push({ uid: d.id, ...d.data() });
      });
    } catch(e){ console.warn('name search:', e); }

    searchResults = results;

    if (!results.length){
      body.innerHTML = `
        <div class="su-empty">
          <div class="su-empty-icon">😔</div>
          <div class="su-empty-text">কেউ পাওয়া যায়নি</div>
          <div class="su-empty-sub">অন্য নাম বা MOI ID দিয়ে চেষ্টা করুন</div>
        </div>`;
      return;
    }

    renderSearchResults();
  } catch(e){
    console.error(e);
    body.innerHTML = `<div class="su-empty"><div class="su-empty-icon">⚠️</div><div class="su-empty-text">সমস্যা হয়েছে</div><div class="su-empty-sub">${esc(e.message)}</div></div>`;
  }
}

function renderSearchResults(){
  const body = $('suBody');
  body.innerHTML = searchResults.map(u => {
    const isMe = u.uid === me.uid;
    const isFriend = !!myFriends[u.uid];
    const isSent = !!mySentRequests[u.uid];
    const isIncoming = !!myRequests[u.uid];

    let btnHTML = '';
    if (isMe){
      btnHTML = `<button class="su-user-btn self"><i class="fa-solid fa-user"></i> You</button>`;
    } else if (isFriend){
      btnHTML = `<button class="su-user-btn friend" onclick="openSearchUserChat('${esc(u.uid)}')"><i class="fa-solid fa-comment-dots"></i> Message</button>`;
    } else if (isIncoming){
      btnHTML = `<button class="su-user-btn incoming" onclick="acceptSearchRequest('${esc(u.uid)}')"><i class="fa-solid fa-check"></i> Accept</button>`;
    } else if (isSent){
      btnHTML = `<button class="su-user-btn sent"><i class="fa-solid fa-check"></i> Sent</button>`;
    } else {
      btnHTML = `<button class="su-user-btn add" onclick="sendSearchRequest('${esc(u.uid)}', this)"><i class="fa-solid fa-user-plus"></i> Add</button>`;
    }

    return `<div class="su-user-card">
      <img src="${esc(u.photo || u.avatar || DEFAULT_AV)}" class="su-user-avatar" onerror="this.src='${DEFAULT_AV}'">
      <div class="su-user-info">
        <div class="su-user-name">${esc(u.name || 'User')}</div>
        <div class="su-user-id">🆔 ${esc(u.moiId || u.uid.slice(0,8))}</div>
      </div>
      ${btnHTML}
    </div>`;
  }).join('');
}

window.sendSearchRequest = async (uid, btn) => {
  if (!me || !uid || uid === me.uid) return;
  btn.disabled = true;
  btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Sending...';
  try {
    await setDoc(doc(db, 'friendRequests', uid, 'items', me.uid), {
      fromUid: me.uid, fromName: me.name, fromPhoto: me.photo, ts: Date.now()
    });
    await setDoc(doc(db, 'users', me.uid, 'sentRequests', uid), { ts: Date.now() });
    btn.className = 'su-user-btn sent';
    btn.innerHTML = '<i class="fa-solid fa-check"></i> Sent';
    toast('✅ অনুরোধ পাঠানো হয়েছে');
  } catch(e){
    console.error(e);
    toast('❌ ' + e.message);
    btn.disabled = false;
    btn.innerHTML = '<i class="fa-solid fa-user-plus"></i> Add';
  }
};

window.acceptSearchRequest = async (uid) => {
  if (!me || !uid) return;
  try {
    await setDoc(doc(db, 'users', me.uid, 'friends', uid), { since: Date.now(), uid });
    await setDoc(doc(db, 'users', uid, 'friends', me.uid), { since: Date.now(), uid: me.uid });
    await deleteDoc(doc(db, 'friendRequests', me.uid, 'items', uid));
    await deleteDoc(doc(db, 'users', uid, 'sentRequests', me.uid));
    toast('🎉 আপনি এখন বন্ধু');
    renderSearchResults();
  } catch(e){ toast('❌ ' + e.message); }
};

window.openSearchUserChat = (uid) => {

/* ========== HELPERS ========== */
function nowTime(){ return new Date().toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' }); }
function fmtTime(sec){
  if (!isFinite(sec) || sec < 0) sec = 0;
  const s = Math.floor(sec);
  return Math.floor(s/60) + ':' + String(s%60).padStart(2,'0');
}
function timeAgo(ts){
  if (!ts) return '';
  const m = Math.floor((Date.now() - ts) / 60000);
  if (m < 1) return 'এইমাত্র';
  if (m < 60) return m + 'মি';
  const h = Math.floor(m / 60);
  if (h < 24) return h + 'ঘ';
  const d = Math.floor(h / 24);
  if (d < 7) return d + 'দিন';
  return new Date(ts).toLocaleDateString('bn-BD');
}
window.copyMyUid = () => {
  const t = me.moiId || me.uid;
  navigator.clipboard.writeText(t).then(() => toast('✅ ' + t)).catch(() => toast(t));
};
let toastTimer;
function toast(msg){
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}
